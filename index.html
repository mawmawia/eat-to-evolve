<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Eat to Evolve: Merge</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
:root{--cell:56px;--board-w:280px;--board-h:392px;--gold:#ffcc00;--green:#45ff72;}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030508}
body{color:white;display:flex;flex-direction:column;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
#bootScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030508;z-index:2000;transition:opacity.55s ease;}
.bootDna{font-size:58px;filter:drop-shadow(0 0 18px rgba(255,204,0,.35));animation:dnaPulse 1.1s ease-in-out infinite;}
.bootText{margin-top:12px;font-size:13px;font-weight:900;letter-spacing:3px;color:#aeb8c8;}
.loadTrack{width:210px;height:7px;margin-top:14px;border-radius:99px;background:#111927;border:1px solid #26344b;overflow:hidden;}
.loadFill{height:100%;width:0;background:linear-gradient(90deg,#ffb900,#fff06a,#ffb900);box-shadow:0 0 14px rgba(255,204,0,.45);animation:loadFill 1.5s ease forwards;}
@keyframes dnaPulse{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes loadFill{0%{width:0}55%{width:68%}100%{width:100%}}
#screen{opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity.7s ease,transform.7s ease,visibility 0s linear.7s;background:radial-gradient(circle at 50% 30%,rgba(255,204,0,.11),transparent 45%),linear-gradient(180deg,#080d16,#030508);position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500}
#screen.show{opacity:1;visibility:visible;transform:translateY(0);transition:opacity.7s ease,transform.7s ease;}
.logoCreature{font-size:48px;margin-bottom:4px;animation:creatureFloat 2.4s ease-in-out infinite;}
@keyframes creatureFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.logo{font-size:40px;line-height:1;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,204,0,.3);letter-spacing:-1px;}
.mergeTitle{font-size:17px;font-weight:1000;letter-spacing:6px;color:white;margin-top:6px;}
.tag{color:#8290a6;margin:10px 0 20px;font-size:12px;}
.bestBox{background:linear-gradient(180deg,#151d2a,#0e151f);border:1px solid #2b3a51;border-radius:12px;padding:8px 20px;margin-bottom:20px;font-size:11px;color:#8290a6;box-shadow:0 8px 30px rgba(0,0,0,.2);}
.bestBox strong{color:white;font-size:15px;margin-left:5px;}
#playBtn{width:240px;padding:16px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffd52a,#ffbd00);color:#080808;font-size:18px;font-weight:900;box-shadow:0 8px 25px rgba(255,204,0,.25);}
#playBtn:active{transform:scale(.98);}
#topbar{width:100%;max-width:400px;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#0a0f16;border-bottom:1px solid #1a2433;flex-shrink:0;padding-top:env(safe-area-inset-top)}
.title{font-size:10px;font-weight:950;letter-spacing:1px;color:#d7dee9}
#gameWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;width:100%;gap:8px;overflow:hidden}
#hud{width:var(--board-w);display:flex;justify-content:space-between;gap:8px}
.hudCard{flex:1;background:#151d2a;border:1px solid #29364a;border-radius:10px;padding:7px 10px;text-align:center}
.hudLabel{display:block;color:#8290a6;font-size:10px;font-weight:800}
.hudValue{font-size:17px;font-weight:900}
#nextBox{display:flex;flex-direction:column;align-items:center;gap:4px;background:#151d2a;border:1px solid var(--gold);border-radius:12px;padding:6px 16px;font-size:12px;font-weight:900}
#nextRow{display:flex;gap:12px;align-items:center}
#nextCreature{font-size:28px}
#nextNextCreature{font-size:20px;opacity:.6;cursor:pointer}
#nextNextCreature:hover{transform:scale(1.1)}
#game{width:var(--board-w);height:var(--board-h);position:relative;border:2px solid #34445c;border-radius:12px;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(180deg,#101721,#0b1017);background-size:var(--cell) var(--cell);touch-action:none;transition:background 0.3s;flex-shrink:0}
#game.boardClear{box-shadow:0 0 30px var(--green)}
#skills{display:flex;gap:10px;justify-content:center;margin-top:8px}
.skillBtn{width:52px;height:52px;border-radius:14px;border:2px solid #29364a;background:linear-gradient(180deg,#151d2a,#0d131d);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8290a6;font-size:22px}
.skillBtn.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 15px rgba(255,204,0,.18)}
.skillBtn.empty{opacity:.6}
.skillCount{font-size:10px;font-weight:900}
#bottombar{width:100%;max-width:400px;height:60px;display:flex;align-items:center;justify-content:space-around;background:#0a0f16;border-top:1px solid #1a2433;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.botBtn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8290a6;font-weight:800;cursor:pointer;min-width:52px}
.botBtn:active{transform:scale(.94)}
.botBtn.disabled{opacity:.4;cursor:not-allowed}
.botBtn.soundActive{color:var(--green)}
.cell{position:absolute;width:var(--cell);height:var(--cell);display:grid;place-items:center;font-size:32px;transition:top 100ms ease}
.falling{position:absolute;width:var(--cell);height:var(--cell);display:grid;place-items:center;font-size:32px;z-index:20}
.shake{animation:shake 160ms ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.floatText{position:absolute;font-weight:900;font-size:14px;color:var(--green);pointer-events:none;animation:floatUp 800ms ease-out forwards;z-index:30}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.explosion{position:absolute;font-size:24px;pointer-events:none;animation:explode 300ms ease-out forwards}
@keyframes explode{0%{opacity:1;transform:scale(0.5)}100%{opacity:0;transform:scale(1.8)}}
#message{height:20px;text-align:center;color:#aeb8c8;font-size:11px;font-weight:800}
.messageGood{color:var(--green)!important}.messageBad{color:var(--gold)!important}
#gameover{position:absolute;inset:0;background:rgba(2,4,7,.95);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:100;border-radius:12px;text-align:center}
#gameover button{width:220px;padding:14px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffd52a,#ffbd00);color:#080808;font-size:15px;font-weight:900}
#reviveBtn{background:linear-gradient(180deg,#45ff72,#2ecc5d)!important;color:#000!important;}
#leaderboardList{text-align:left;font-size:12px;line-height:1.8;width:100%;}
.leaderRow{display:flex;justify-content:space-between;}
#modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:900;padding:20px;}
#modalBackdrop.show{display:flex;}
.modal{width:min(340px,92vw);background:linear-gradient(180deg,#151d2a,#0b111a);border:1px solid #33445e;border-radius:18px;padding:24px 20px 20px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.55);animation:modalIn.22s ease;max-height:80vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modalIcon{font-size:42px;margin-bottom:8px;}
.modal h2{margin:0 0 8px;font-size:20px;}
.modal p{margin:0;color:#8290a6;font-size:13px;line-height:1.5;white-space:pre-line;text-align:left;}
.modalClose{margin-top:18px;width:100%;padding:11px;border:1px solid #34445c;border-radius:10px;background:#151d2a;color:white;font-weight:900;}
</style>
</head>
<body>
<div id="bootScreen"><div class="bootDna">🧬</div><div class="bootText">LOADING...</div><div class="loadTrack"><div class="loadFill"></div></div></div>
<div id="screen"><div class="logoCreature">🐜</div><div class="logo">EAT TO EVOLVE</div><div class="mergeTitle">MERGE</div><div class="tag">Drop • Merge • Evolve • Survive</div><div class="bestBox">BEST: <strong id="titleBest">0</strong></div><button id="playBtn" onclick="startGame(false)">PLAY</button></div>
<div id="topbar" style="display:none"><div class="topBtn" id="profileTop">👤 Guest</div><div class="title">EAT TO EVOLVE: MERGE</div><div class="topBtn" onclick="openPanel('howto')">📝 How</div></div>
<div id="gameWrap" style="display:none">
  <div id="hud"><div class="hudCard"><span class="hudLabel">Score</span><span class="hudValue" id="score">0</span></div><div class="hudCard"><span class="hudLabel">Best</span><span class="hudValue" id="best">0</span></div></div>
  <div id="nextBox"><span>NEXT</span><div id="nextRow"><span id="nextCreature">🐜</span><span id="nextNextCreature" onclick="swapNext()">🦎</span></div></div>
  <div id="message">TAP A COLUMN TO DROP</div>
  <div id="game"></div>
  <div id="skills"><div id="skill1" class="skillBtn locked" onclick="handleSkillClick(1)">⚡<div class="skillCount" id="count1">🔒</div></div><div id="skill2" class="skillBtn locked" onclick="handleSkillClick(2)">✚<div class="skillCount" id="count2">🔒</div></div><div id="skill3" class="skillBtn locked" onclick="handleSkillClick(3)">💣<div class="skillCount" id="count3">🔒</div></div><div id="skill4" class="skillBtn locked" onclick="handleSkillClick(4)">🧬<div class="skillCount" id="count4">🔒</div></div></div>
</div>
<div id="bottombar" style="display:none"><div class="botBtn" onclick="openPanel('profile')">👤<span>Profile</span></div><div class="botBtn disabled" onclick="soundNotImplemented()"><span class="soundIcon">🔊</span><span>Sound</span></div><div class="botBtn" onclick="openPanel('leaderboard')">🏆<span>Leaderboard</span></div><div class="botBtn" onclick="openPanel('daily')">📅<span>Daily</span></div><div class="botBtn" onclick="openPanel('shop')">🛍️<span>Shop</span></div></div>
<div id="gameover"><h2>GAME OVER</h2><div>Score: <span id="finalScore">0</span></div><button id="reviveBtn" onclick="attemptRevive()">WATCH AD & CONTINUE</button><button id="newGameBtn" onclick="startGame(true)">NEW GAME</button><button onclick="openPanel('leaderboard')">🏆 LEADERBOARD</button></div>
<div id="modalBackdrop" onclick="closePanel(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalIcon" id="modalIcon">🧬</div><h2 id="modalTitle">TITLE</h2><div id="modalContent"><p id="modalText">Text</p><div id="leaderboardList"></div></div><button class="modalClose" id="modalClose" onclick="closePanel()">CLOSE</button></div></div>
<script>
const LEADERBOARD_ENCRYPTION_KEY = "";
const W=5,H=7;
const CREATURES=[
  {name:"Ant",emoji:"🐜",lvl:1},{name:"Cockroach",emoji:"🪳",lvl:2},
  {name:"Bird",emoji:"🐦",lvl:3},{name:"Lizard",emoji:"🦎",lvl:4},
  {name:"Crocodile",emoji:"🐊",lvl:5},{name:"Dragon",emoji:"🐲",lvl:6},
  {name:"Dragon King",emoji:"👑",lvl:7},{name:"Elder Dragon",emoji:"🔥",lvl:8},
  {name:"Dragon God",emoji:"☄️",lvl:9}
];
let board,score=0,best=0,nextCreature=null,nextNextCreature=null,gameOver=false,busy=false,CELL=56;
let highestLvl=1, skillUnlocked=[false,false,false,false], skillCharges=[0,0,0,0], adBusy=[false,false,false,false], activeSkill=null, soundOn=true, reviveCooldownGames=0, reviveAdBusy=false;
let sdkReady=false, playerName="Guest", localLeaderboard=[];
const gameEl=document.getElementById("game");

function soundNotImplemented(){setMessage("SOUND: COMING SOON","bad");}

const panelData={
  profile:{icon:"👤",title:"Profile",build:()=>`Name: ${playerName}\nBest Score: ${best.toLocaleString()}\nStatus: ${sdkReady?'CrazyGames Connected':'Guest Mode'}\n\nNote: Leaderboard is local until encryption key is set.`},
  leaderboard:{icon:"🏆",title:"LEADERBOARD",build:()=>{let html="";localLeaderboard.sort((a,b)=>b.score-a.score).slice(0,10).forEach((e,i)=>{html+=`<div class="leaderRow"><span>${i+1}. ${e.name}</span><span>${e.score.toLocaleString()}</span></div>`});return html||"No scores yet";}},
  howto:{icon:"📝",title:"HOW TO PLAY",build:()=>`1. 🐜 DROP - Tap a column\n2. 🔗 MERGE - Match 2 identical\n3. 🧬 EVOLVE - Reach Dragon God ☄️\n\n4. 👀 NEXT - Tap small to swap\n5. ⚡ POWERS - Unlock at Dragon stages\n6. 💥 CLEAR - Clear board for +500`},
  daily:{icon:"📅",title:"Daily Rewards",build:()=>"COMING SOON"},
  shop:{icon:"🛍️",title:"Shop",build:()=>"COMING SOON"}
};

function openPanel(type){if(gameOver&&type!='leaderboard')return;const p=panelData[type];document.getElementById("modalIcon").textContent=p.icon;document.getElementById("modalTitle").textContent=p.title;if(type==='leaderboard'){document.getElementById("modalText").style.display='none';document.getElementById("leaderboardList").innerHTML=p.build();document.getElementById("leaderboardList").style.display='block';}else{document.getElementById("modalText").textContent=p.build();document.getElementById("modalText").style.display='block';document.getElementById("leaderboardList").style.display='none';}document.getElementById("modalBackdrop").classList.add("show");if(window.CrazyGames?.SDK?.game?.gameplayStop)window.CrazyGames.SDK.gameplayStop();}
function closePanel(){document.getElementById("modalBackdrop").classList.remove("show");document.getElementById("modalClose").onclick=()=>closePanel();
if(!gameOver&&board&&window.CrazyGames?.SDK?.game?.gameplayStart)window.CrazyGames.SDK.gameplayStart();}

async function initCrazyGames(){const boot=document.getElementById("bootScreen");try{if(window.CrazyGames?.SDK){await window.CrazyGames.SDK.init();sdkReady=true;const user=await window.CrazyGames.SDK.user.getUser();playerName=user.username||"Guest";document.getElementById("profileTop").textContent=`👤 ${playerName}`;const save=await window.CrazyGames.SDK.data.getItem("save");if(save){best=save.best||0;localLeaderboard=save.lb||[];}}logEvent("SDK_Ready");}catch(e){console.warn("SDK Error",e)}setTimeout(()=>{boot.style.opacity="0";setTimeout(()=>{boot.style.display="none";document.getElementById("screen").classList.add("show");document.getElementById("titleBest").textContent=best;},550);},1250);}
initCrazyGames();

async function encryptScore(score){return btoa(JSON.stringify({s:score,t:Date.now()}));}
async function saveGame(){const data={best,lb:localLeaderboard};if(sdkReady)await window.CrazyGames.SDK.data.setItem("save",data);}
async function recordFinalScore(){if(score<=0)return;localLeaderboard.push({name:playerName,score});localLeaderboard.sort((a,b)=>b.score-a.score);localLeaderboard=localLeaderboard.slice(0,10);await saveGame();if(sdkReady&&LEADERBOARD_ENCRYPTION_KEY){try{const encrypted = await encryptScore(score);await window.CrazyGames.SDK.user.submitScore({encryptedScore: encrypted});}catch(e){console.warn("Leaderboard submit failed",e)}}}

function addSkillCharge(skillId){skillCharges[skillId-1]++;updateSkillsUI();}
function checkDragonUnlocks(){const unlocks=[{lvl:6,skill:1},{lvl:7,skill:2},{lvl:8,skill:3},{lvl:9,skill:4}];for(const u of unlocks){const i=u.skill-1;if(highestLvl>=u.lvl&&!skillUnlocked[i]){skillUnlocked[i]=true;skillCharges[i]=1;setMessage(`🐲 ${CREATURES[u.lvl-1].name} UNLOCKED!`,"good");}}updateSkillsUI();}
function updateSkillsUI(){for(let i=0;i<4;i++){const btn=document.getElementById("skill"+(i+1)),count=document.getElementById("count"+(i+1));if(skillUnlocked[i]){btn.classList.remove("locked");count.textContent=skillCharges[i]>0?skillCharges[i]:"0";btn.classList.toggle("empty",skillCharges[i]===0);}else{btn.classList.add("locked");count.textContent="🔒";}}}

function handleSkillClick(id){const i=id-1;if(!skillUnlocked[i]||adBusy[i])return;if(skillCharges[i]===0){openSkillAdModal(id);return;}selectSkill(id);}

function openSkillAdModal(id){
  if(window.CrazyGames?.SDK?.game?.gameplayStop)window.CrazyGames.SDK.gameplayStop();
  document.getElementById("modalIcon").textContent=["⚡","✚","💣","🧬"][id-1];
  document.getElementById("modalTitle").textContent="POWER EMPTY";
  document.getElementById("modalText").textContent="Watch ad for +3 uses?";
  document.getElementById("modalBackdrop").classList.add("show");

  const closeBtn=document.getElementById("modalClose");
  closeBtn.onclick=()=>{
    closeBtn.onclick=()=>closePanel();
    closePanel();
    watchAdForSkill(id);
  };
}

function selectSkill(id){activeSkill=id;document.querySelectorAll(".skillBtn").forEach(b=>b.classList.remove("active"));document.getElementById("skill"+id).classList.add("active");setMessage("SELECT TARGET","good");}

function watchAdForSkill(id){
  const i=id-1;
  if(!window.CrazyGames?.SDK?.ad?.requestAd){skillCharges[i]+=3;updateSkillsUI();return;}
  adBusy[i]=true;
  window.CrazyGames.SDK.ad.requestAd("rewarded",{
    adStarted:()=>{},
    adFinished:()=>{skillCharges[i]+=3;updateSkillsUI();adBusy[i]=false;},
    adError:(error)=>{console.warn("Rewarded ad failed",error);setMessage("AD NOT AVAILABLE","bad");adBusy[i]=false;}
  });
}

async function attemptRevive(){
  if(reviveAdBusy){setMessage("REVIVE AD LOADING...","bad");return;}
  if(reviveCooldownGames>0){setMessage(`REVIVE IN ${reviveCooldownGames} GAMES`,"bad");return;}

  reviveAdBusy=true;
  const doRevive=async()=>{reviveCooldownGames=3;for(let i=0;i<2;i++)board.shift(),board.push(Array(W).fill(null));settle();render();document.getElementById("gameover").style.display="none";gameOver=false;reviveAdBusy=false;};
  if(!window.CrazyGames?.SDK?.ad?.requestAd){await doRevive();return;}
  window.CrazyGames.SDK.ad.requestAd("rewarded",{
    adStarted:()=>{},
    adFinished:async()=>{await doRevive();},
    adError:(error)=>{console.warn("Revive ad failed",error);setMessage("AD NOT AVAILABLE","bad");reviveAdBusy=false;}
  });
}

function useSkill(x,y){
  const id=activeSkill;activeSkill=null;document.querySelectorAll(".skillBtn").forEach(b=>b.classList.remove("active"));
  if(x<0||x>=W||y<0||y>=H){setMessage("INVALID TARGET","bad");return;}
  if(id===4&&!board[y][x]){setMessage("SELECT A CREATURE","bad");return;}
  skillCharges[id-1]--;updateSkillsUI();
  if(id===1)for(let cx=0;cx<W;cx++)board[y][cx]=null,spawnExplosion(cx,y);
  if(id===2){for(let cx=0;cx<W;cx++)board[y][cx]=null,spawnExplosion(cx,y);for(let ry=0;ry<H;ry++)board[ry][x]=null,spawnExplosion(x,ry);}
  if(id===3)for(let ry=y-1;ry<=y+1;ry++)for(let cx=x-1;cx<=x+1;cx++)if(ry>=0&&ry<H&&cx>=0&&cx<W)board[ry][cx]=null,spawnExplosion(cx,ry);
  if(id===4){const target=board[y][x].lvl;for(let ry=0;ry<H;ry++)for(let cx=0;cx<W;cx++)if(board[ry][cx]?.lvl===target)board[ry][cx]=null,spawnExplosion(cx,ry);}
  resolveBoard();checkDragonUnlocks();render();saveGame();
}

function spawnExplosion(x,y){const el=document.createElement("div");el.className="explosion";el.style.left=x*CELL+CELL/4+"px";el.style.top=y*CELL+CELL/4+"px";el.textContent="💥";gameEl.appendChild(el);setTimeout(()=>el.remove(),300);}
function swapNext(){[nextCreature,nextNextCreature]=[nextNextCreature,nextCreature];updateNext();}

function initBoard(resetSkills=true){
  updateCellSize();
  if(reviveCooldownGames>0)reviveCooldownGames--;

  if(resetSkills){
    skillUnlocked=[false,false,false,false];
    skillCharges=[0,0,0,0];
  }

  adBusy=[false,false,false,false];
  activeSkill=null;

  board=Array.from({length:H},()=>Array(W).fill(null));
  score=0;gameOver=false;busy=false;highestLvl=1;
  nextCreature=randCreature();nextNextCreature=randCreature();

  updateHUD();updateNext();render();updateSkillsUI();
  if(window.CrazyGames?.SDK?.game?.gameplayStart)window.CrazyGames.SDK.gameplayStart();
}

function updateCellSize(){const vw=window.innerWidth; const vh=window.innerHeight-50-60; const cellByW=vw*0.9/W; const cellByH=vh*0.55/H; CELL=Math.floor(Math.min(cellByW, cellByH, 60)); document.documentElement.style.setProperty("--cell",CELL+"px"); document.documentElement.style.setProperty("--board-w",CELL*W+"px"); document.documentElement.style.setProperty("--board-h",CELL*H+"px");}
function randCreature(){return{...CREATURES[Math.floor(Math.random()*5)]};}
function startGame(reset=true){document.getElementById("screen").style.display="none";document.getElementById("topbar").style.display="flex";document.getElementById("gameWrap").style.display="flex";document.getElementById("skills").style.display="flex";document.getElementById("bottombar").style.display="flex";document.getElementById("gameover").style.display="none";initBoard(reset);}
function updateHUD(){document.getElementById("score").textContent=score;document.getElementById("best").textContent=best;document.getElementById("titleBest").textContent=best;}
function updateNext(){document.getElementById("nextCreature").textContent=CREATURES[nextCreature.lvl-1].emoji;document.getElementById("nextNextCreature").textContent=CREATURES[nextNextCreature.lvl-1].emoji;}
function setMessage(t,ty=""){const el=document.getElementById("message");el.textContent=t;el.className=ty==="good"?"messageGood":ty==="bad"?"messageBad":"";}
function render(){gameEl.querySelectorAll(".cell").forEach(el=>el.remove());for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(board[y][x]){const div=document.createElement("div");div.className="cell";div.style.left=x*CELL+"px";div.style.top=y*CELL+"px";div.textContent=CREATURES[board[y][x].lvl-1].emoji;gameEl.appendChild(div);}}

function resolveBoard(){let anyMerged=false,combo=0;let merged;do{merged=false;for(let y=H-1;y>=0;y--)for(let x=0;x<W;x++){const cur=board[y][x];if(!cur)continue;if(y+1<H&&board[y+1][x]?.lvl===cur.lvl){merge(x,y,x,y+1);merged=true;}else if(x+1<W&&board[y][x+1]?.lvl===cur.lvl){merge(x,y,x+1,y);merged=true;}}if(merged){anyMerged=true;combo++;settle();}}while(merged);if(combo>1){score+=combo*50;spawnFloatText(2,3,`COMBO x${combo}`);}return anyMerged;}
function merge(x1,y1,x2,y2){const newLvl=board[y2][x2].lvl+1;board[y2][x2]={lvl:newLvl};if(newLvl>highestLvl)highestLvl=newLvl;if(newLvl>=6&&newLvl<=9)addSkillCharge(newLvl-5);board[y1][x1]=null;score+=10*newLvl*1.5;spawnExplosion(x2,y2);}
function settle(){for(let x=0;x<W;x++){let w=H-1;for(let y=H-1;y>=0;y--)if(board[y][x]){if(w!==y){board[w][x]=board[y][x];board[y][x]=null;}w--;}}}
function addPressureRow(){if(board[0].some(c=>c))return false;for(let y=0;y<H-1;y++)board[y]=[...board[y+1]];board[H-1]=Array(W).fill(null).map(()=>Math.random()<0.5?randCreature():null);return true;}
function checkBoardClear(){if(board.every(r=>r.every(c=>!c))){score+=500;setMessage("BOARD CLEARED! +500","good");gameEl.classList.add("boardClear");setTimeout(()=>gameEl.classList.remove("boardClear"),600);}}

async function drop(col){
  if(col<0||col>=W||gameOver||busy||activeSkill)return;
  busy=true;let row=-1;for(let y=H-1;y>=0;y--)if(!board[y][col]){row=y;break;}if(row===-1){busy=false;return;}
  const creature=nextCreature;nextCreature=nextNextCreature;nextNextCreature=randCreature();updateNext();board[row][col]=creature;
  const didMerge = resolveBoard();checkDragonUnlocks();render();
  if(!didMerge){await new Promise(r=>setTimeout(r,200));if(!addPressureRow()){gameOverFn();busy=false;return;}}
  if(board[0].some(c=>c)){gameOverFn();}
  checkBoardClear();busy=false;
}

async function gameOverFn(){
  gameOver=true;if(score>best){best=score;}
  await recordFinalScore();
  updateHUD();document.getElementById("finalScore").textContent=score;document.getElementById("gameover").style.display="flex";
  if(window.CrazyGames?.SDK?.game?.gameplayStop)window.CrazyGames.SDK.gameplayStop();
}

gameEl.addEventListener("pointerdown",e=>{if(gameOver||busy||!board)return;const rect=gameEl.getBoundingClientRect();const col=Math.floor((e.clientX-rect.left)/CELL);if(activeSkill)useSkill(col,Math.floor((e.clientY-rect.top)/CELL));else drop(col);});
function spawnFloatText(x,y,t){const el=document.createElement("div");el.className="floatText";el.style.left=x*CELL+"px";el.style.top=y*CELL+"px";el.textContent=t;gameEl.appendChild(el);setTimeout(()=>el.remove(),800);}
function logEvent(n,d={}){console.log(`[E2E] ${n}`,d);}
window.addEventListener('resize', updateCellSize);
</script>
