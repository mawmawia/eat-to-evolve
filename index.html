<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Eat to Evolve v1.0.2</title>
<!-- CRAZYGAMES SDK v3 -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  :root{--w:240;--h:336;--cell:48}
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto}
  body{margin:0;background:#0a0a0a;color:#fff;display:grid;place-items:center;min-height:100vh;overflow:hidden}
  #wrapper{position:relative}
  #game{width:calc(var(--w) * 1px);height:calc(var(--h) * 1px);background:#111;border:2px solid #333;position:relative;overflow:hidden;border-radius:8px}
.cell{position:absolute;width:calc(var(--cell) * 1px);height:calc(var(--cell) * 1px);display:grid;place-items:center;font-size:26px;transition:all 120ms ease}
.fall{animation:fall 100ms ease}
  @keyframes fall{from{transform:translateY(-20px);opacity:0.5} to{transform:translateY(0);opacity:1}}
.merge{animation:merge 150ms ease;z-index:10}
  @keyframes merge{0%{transform:scale(1)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.shake{animation:shake 150ms}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-2px,2px)}75%{transform:translate(2px,-2px)}}
.pushdown{animation:push 300ms ease}
  @keyframes push{0%{transform:translateY(-48px)}100%{transform:translateY(0)}}
.scorepop{position:absolute;color:#ffcc00;font-weight:800;font-size:16px;animation:pop 600ms ease forwards;pointer-events:none;text-shadow:0 0 4px #000}
  @keyframes pop{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-30px) scale(1.2);opacity:0}}
.lvltext{position:absolute;bottom:2px;right:2px;font-size:9px;color:#aaa;font-weight:700}
.goldflash{position:absolute;inset:0;background:radial-gradient(circle, rgba(255,215,0,0.6) 0%, transparent 70%);animation:flash 400ms ease;pointer-events:none}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}

  #hud{display:flex;justify-content:space-between;width:calc(var(--w) * 1px);margin-bottom:8px;font-weight:700}
  #tapzones{width:calc(var(--w) * 1px);height:48px;display:flex}
.zone{flex:1;background:#222;border:1px solid #333;border-radius:6px;margin:0 2px;display:grid;place-items:center;opacity:0.6;font-size:20px}
.zone:active{background:#44ff44;opacity:1}

  #screen{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column;gap:12px;background:#0a0a0a;z-index:200;border-radius:8px}
  #screen h1{font-size:28px;margin:0;color:#ffcc00}
  #screen.loading{font-size:12px;opacity:0.7}
  #screen button{padding:14px 28px;background:#ffcc00;color:#000;border:0;border-radius:8px;font-weight:800;font-size:16px;width:200px}
  #screen button:disabled{background:#333;color:#666}

  #gameover{position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;flex-direction:column;gap:10px;z-index:100;border-radius:8px;padding:16px;text-align:center}
  #gameover button{padding:12px 20px;background:#ffcc00;color:#000;border:0;border-radius:8px;font-weight:800;font-size:14px;width:200px}
  #gameover button.secondary{background:#444;color:#fff}
  #gameover button:disabled{background:#222;color:#666}
  #version{position:absolute;bottom:4px;right:4px;font-size:10px;opacity:0.5}
</style>
</head>
<body>
<div id="wrapper">
  <div id="hud" style="display:none">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div id="game"></div>

  <div id="screen">
    <h1>EAT TO EVOLVE</h1>
    <div class="loading" id="loadingText">Loading...</div>
    <div>Best: <span id="titleBest">0</span></div>
    <button id="playBtn" onclick="startGame()" disabled>PLAY</button>
  </div>

  <div id="gameover">
    <h2>GAME OVER</h2>
    <div>Score: <span id="finalScore">0</span></div>
    <div>Best: <span id="finalBest">0</span></div>
    <button id="adBtn" onclick="watchAdContinue()">📺 WATCH AD & CONTINUE</button>
    <button class="secondary" onclick="shareScore()">📤 SHARE SCORE</button>
    <button class="secondary" onclick="startGame()">PLAY AGAIN</button>
  </div>
  <div id="tapzones" style="display:none">
    <div class="zone" data-col="0">⬇️</div>
    <div class="zone" data-col="1">⬇️</div>
    <div class="zone" data-col="2">⬇️</div>
    <div class="zone" data-col="3">⬇️</div>
    <div class="zone" data-col="4">⬇️</div>
  </div>
  <div id="version">v1.0.2 CrazyGames</div>
</div>

<script>
const W=5,H=7,CELL=48;
const CREATURES = [
  {name:"Ant",emoji:"🐜",lvl:1,weight:40},
  {name:"Cockroach",emoji:"🪳",lvl:2,weight:30},
  {name:"Bird",emoji:"🐦",lvl:3,weight:20},
  {name:"Lizard",emoji:"🦎",lvl:4,weight:9},
  {name:"Crocodile",emoji:"🐊",lvl:5,weight:1}
];

let board, score, best, gameOver, hasUsedContinue, audioCtx;
let crazyReady = false; // FIX: SDK state
const gameEl = document.getElementById('game');

// V1.0.2: CRAZYGAMES SDK INIT
async function initCrazyGames(){
  try {
    await window.CrazyGames.SDK.init();
    crazyReady = true;
    document.getElementById('loadingText').textContent = "Ready";
    document.getElementById('playBtn').disabled = false;
    console.log("CrazyGames SDK Initialized");
  } catch(e) {
    console.log("CrazyGames SDK unavailable:", e);
    document.getElementById('loadingText').textContent = "Offline Mode";
    document.getElementById('playBtn').disabled = false; // Still allow play for testing
  }
}

function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);

  if(type === 'drop'){ o.frequency.value = 120; g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); o.start(); o.stop(audioCtx.currentTime + 0.1); }
  if(type === 'pop'){ o.frequency.value = 600; g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); o.start(); o.stop(audioCtx.currentTime + 0.15); }
  if(type === 'chime'){ o.frequency.value = 800; g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); o.start(); o.stop(audioCtx.currentTime + 0.2); }
  if(type === 'thump'){ o.frequency.value = 80; g.gain.setValueAtTime(0.3, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); o.start(); o.stop(audioCtx.currentTime + 0.3); }
  if(type === 'jackpot'){
    const boom = audioCtx.createOscillator(); const boomG = audioCtx.createGain();
    boom.frequency.value = 60; boomG.gain.setValueAtTime(0.5, audioCtx.currentTime); boomG.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    boom.connect(boomG).connect(audioCtx.destination); boom.start(); boom.stop(audioCtx.currentTime + 0.4);
    setTimeout(()=>{ const k = audioCtx.createOscillator(); const kG = audioCtx.createGain();
    k.frequency.value = 1200; kG.gain.setValueAtTime(0.25, audioCtx.currentTime); kG.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    k.connect(kG).connect(audioCtx.destination); k.start(); k.stop(audioCtx.currentTime + 0.3);}, 150);
    setTimeout(()=>{ for(let i=0;i<3;i++){ const s = audioCtx.createOscillator(); const sG = audioCtx.createGain();
    s.frequency.value = 1500 + i*200; sG.gain.setValueAtTime(0.1, audioCtx.currentTime); sG.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    s.connect(sG).connect(audioCtx.destination); s.start(audioCtx.currentTime + i*0.08); s.stop(audioCtx.currentTime + 0.2 + i*0.08);}}, 300);
  }
  if(type === 'wah'){ o.frequency.value = 400; o.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5); g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); o.start(); o.stop(audioCtx.currentTime + 0.5); }
}

function randCreature(){
  const total = CREATURES.reduce((a,b)=>a+b.weight,0);
  let r = Math.random()*total;
  for(const c of CREATURES){ r -= c.weight; if(r <= 0) return {...c}; }
  return {...CREATURES[0]};
}

function initBoard(){
  board = Array.from({length:H},()=>Array(W).fill(null));
  score = 0; gameOver = false; hasUsedContinue = false;
  best = parseInt(localStorage.getItem("eatEvolveBest")||"0");
  document.getElementById('best').textContent = best;
  document.getElementById('titleBest').textContent = best;
  addPressureRow();
  render();
}

function render(){
  gameEl.querySelectorAll('.cell').forEach(el => el.remove());
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      if(board[y][x]){
        const div = document.createElement('div');
        div.className='cell';
        div.style.left = x*CELL+'px';
        div.style.top = y*CELL+'px';
        const lvl = board[y][x].lvl;
        div.innerHTML = getEmojiByLvl(lvl) + `<div class="lvltext">${lvl}</div>`;
        gameEl.appendChild(div);
      }
    }
  }
  document.getElementById('score').textContent = score;
}

function drop(col){
  if(gameOver) return;
  initAudio();
  playSound('drop');
  let y = H-1;
  while(y>=0 && board[y][col]) y--;
  if(y<0) return;

  board[y][col] = randCreature();
  render();

  const mergeResult = resolveMerges();
  settle();

  if(!mergeResult.didMerge){
    if(!addPressureRow()){
      gameOverFn();
      return;
    }
  } else {
    gameEl.style.borderColor = '#44ff44';
    setTimeout(()=>gameEl.style.borderColor='#333',150);
    if(mergeResult.isDragonMerge){
      pushBoardDown();
      playSound('jackpot');
      const flash = document.createElement('div'); flash.className='goldflash';
      gameEl.appendChild(flash); setTimeout(()=>flash.remove(),400);
    }
  }

  if(board[0].some(cell=>cell)) gameOverFn();
}

function resolveMerges(){
  let didMergeThisTurn = false;
  let isDragonMerge = false;
  while(true){
    let foundPair = false;
    outer: for(let y=H-1;y>=0;y--){
      for(let x=0;x<W;x++){
        if(!board[y][x]) continue;
        const cur = board[y][x];
        if(x+1<W && board[y][x+1] && board[y][x+1].lvl === cur.lvl){
          const newLvl = cur.lvl + 1;
          if(newLvl >= 6) isDragonMerge = true;
          mergeCells(x,y,x+1,y,newLvl);
          foundPair = true; didMergeThisTurn = true;
          break outer;
        }
        if(y+1<H && board[y+1][x] && board[y+1][x].lvl === cur.lvl){
          const newLvl = cur.lvl + 1;
          if(newLvl >= 6) isDragonMerge = true;
          mergeCells(x,y,x,y+1,newLvl);
          foundPair = true; didMergeThisTurn = true;
          break outer;
        }
      }
    }
    if(foundPair) settle();
    else break;
  }
  return {didMerge: didMergeThisTurn, isDragonMerge};
}

function mergeCells(x1,y1,x2,y2,newLvl){
  board[y2][x2].lvl = newLvl;
  board[y1][x1] = null;
  addScore(newLvl, x2*CELL, y2*CELL);
  gameEl.classList.add('shake'); setTimeout(()=>gameEl.classList.remove('shake'),150);
  if(newLvl === 5) playSound('thump');
  else if(newLvl >= 3) playSound('chime');
  else playSound('pop');
}

function addScore(newLvl, px, py){
  let points = 10 * newLvl;
  if(newLvl >= 6) points = 100 * (newLvl - 5);
  score += points;
  const pop = document.createElement('div');
  pop.className = 'scorepop';
  pop.style.left = px + 10 + 'px';
  pop.style.top = py + 'px';
  pop.textContent = '+' + points;
  gameEl.appendChild(pop);
  setTimeout(()=>pop.remove(), 600);
}

function getEmojiByLvl(lvl){
  if(lvl<=5) return ["","🐜","🪳","🐦","🦎","🐊"][lvl];
  const dLvl = lvl - 5;
  if(dLvl === 1) return "🐲";
  if(dLvl === 2) return "🐲👑";
  if(dLvl === 3) return "🐲👑";
  if(dLvl === 4) return "🐲👑";
  return "🐲🔥";
}

function settle(){
  for(let x=0;x<W;x++){
    let write = H-1;
    for(let y=H-1;y>=0;y--){
      if(board[y][x]){
        if(write!== y){
          board[write][x] = board[y][x];
          board[y][x] = null;
        }
        write--;
      }
    }
  }
  render();
}

function pushBoardDown(){
  for(let y=H-1;y>0;y--) board[y] = [...board[y-1]];
  board[0] = Array(W).fill(null);
  gameEl.classList.add('pushdown'); setTimeout(()=>gameEl.classList.remove('pushdown'),300);
  render();
}

function addPressureRow(){
  if(board[0].some(cell=>cell)) return false;
  for(let y=0;y<H-1;y++) board[y] = [...board[y+1]];
  const newRow = Array(W).fill(null);
  for(let x=0;x<W;x++){
    if(Math.random() < 0.6) newRow[x] = randCreature();
  }
  board[H-1] = newRow;
  render();
  return true;
}

function gameOverFn(){
  gameOver = true; playSound('wah');
  if(score > best){ best = score; localStorage.setItem("eatEvolveBest", best); }
  document.getElementById('best').textContent = best;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = best;
  document.getElementById('adBtn').disabled = hasUsedContinue;
  document.getElementById('adBtn').textContent = hasUsedContinue? "USED" : "📺 WATCH AD & CONTINUE";
  document.getElementById('gameover').style.display = 'flex';
}

// V1.0.2: REAL CRAZYGAMES REWARDED AD
function watchAdContinue(){
  if(hasUsedContinue) return;

  const btn = document.getElementById('adBtn');
  btn.disabled = true;
  btn.textContent = "Loading Ad...";

  if(!crazyReady ||!window.CrazyGames?.SDK?.ad){
    btn.disabled = false;
    btn.textContent = "AD UNAVAILABLE";
    return;
  }

  window.CrazyGames.SDK.ad.requestAd("rewarded", {
    adStarted: () => {
      // Pause game audio per CrazyGames requirement
      if(audioCtx && audioCtx.state === "running"){
        audioCtx.suspend().catch(()=>{});
      }
    },
    adFinished: () => {
      // REWARD ONLY ON SUCCESS
      hasUsedContinue = true;
      if(audioCtx && audioCtx.state === "suspended"){
        audioCtx.resume().catch(()=>{});
      }
      doContinue();
    },
    adError: (error) => {
      console.log("Rewarded ad failed:", error);
      if(audioCtx && audioCtx.state === "suspended"){
        audioCtx.resume().catch(()=>{});
      }
      btn.disabled = false;
      btn.textContent = "📺 WATCH AD & CONTINUE";
    }
  });
}

function doContinue(){
  for(let y=0;y<4;y++){ for(let x=0;x<W;x++) board[y][x] = null; }
  settle();
  gameOver = false;
  document.getElementById('gameover').style.display = 'none';
}

function shareScore(){
  const text = `I scored ${score} in Eat to Evolve! Highest: ${best} 🐲🔥 Can you beat me?`;
  if(navigator.share) navigator.share({title:"Eat to Evolve", text}).catch(()=>{});
  else navigator.clipboard.writeText(text);
}

function startGame(){
  initAudio();
  document.getElementById('screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('tapzones').style.display = 'flex';
  document.getElementById('gameover').style.display = 'none';
  initBoard();
}

document.getElementById('tapzones').addEventListener('click', e=>{
  if(e.target.classList.contains('zone')){
    drop(parseInt(e.target.dataset.col));
  }
});

// Init SDK on load
initCrazyGames();
</script>
</body>
</html>
