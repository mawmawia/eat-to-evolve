<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eat to Evolve: Merge</title>
<style>
  body { margin:0; background:#1a1a1a; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial; overflow:hidden; }
  #game { background:#2a5d2a; border:4px solid #fff; position:relative; touch-action:none; }
.cell { position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; text-shadow:2px 2px #000; transition:transform 0.12s ease-out; }
.cell.merge { animation: bounce 0.25s; }
  @keyframes bounce { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
  #ui { position:absolute; top:10px; left:10px; color:#fff; font-size:18px; text-shadow:2px 2px #000; z-index:10; }
  #nextPreview { position:absolute; bottom:90px; width:100%; text-align:center; color:#fff; font-size:16px; }
  #spawnBtn { position:absolute; bottom:20px; width:100%; text-align:center; }
  #spawnBtn button { padding:15px 30px; font-size:20px; background:#4CAF50; color:#fff; border:none; border-radius:10px; }
  #evolvePopup { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); color:#FFD700; padding:15px 25px; border-radius:12px; display:none; z-index:50; font-size:22px; text-align:center; }
.scorePopup { position:absolute; color:#FFD700; font-weight:bold; font-size:20px; pointer-events:none; animation:floatUp 0.8s forwards; }
  @keyframes floatUp { from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-40px)} }
</style>
</head>
<body>
<div id="game" style="width:400px; height:600px;">
  <div id="ui">Score: 0<br>Best: 0<br>Goal: 1000</div>
  <div id="nextPreview">Next:<br>🐜 ANT</div>
  <div id="spawnBtn"><button>SPAWN</button></div>
  <div id="evolvePopup"></div>
</div>

<script>
const GRID_SIZE = 40;
const COLS = 10, ROWS = 15;
const GOAL_SCORE = 1000;
const TIERS = [
  {name:"Ant", emoji:"🐜", color:"#8B4513", score:2},
  {name:"Beetle", emoji:"🪲", color:"#4B0082", score:4},
  {name:"Lizard", emoji:"🦎", color:"#228B22", score:8},
  {name:"Bird", emoji:"🐦", color:"#87CEEB", score:16},
  {name:"Crocodile", emoji:"🐊", color:"#006400", score:32},
  {name:"Lion", emoji:"🦁", color:"#DAA520", score:64},
  {name:"Dragon", emoji:"🐲", color:"#FF0000", score:128}
];

let cells = [];
let occupancy = new Set();
let score = 0, highScore = localStorage.getItem('eatEvolveHigh') || 0;
let nextTier = 0;
let combo = 0;
let gameEl = document.getElementById('game');

function key(x,y){ return x+','+y; }

function spawnCell(tier = nextTier) {
  // BUG FIX 2: Spawn from fixed point: TOP CENTER
  let spawnX = Math.floor(COLS/2);
  let spawnY = 0;
  if(occupancy.has(key(spawnX, spawnY))) { checkGameOver(); return; } // Game over if blocked

  cells.push({x:spawnX, y:spawnY, tier:tier});
  occupancy.add(key(spawnX,spawnY));

  nextTier = Math.random() < 0.8? 0 : 1;
  updateNextPreview();
  render();
  checkMerge();
}

function render() {
  gameEl.querySelectorAll('.cell').forEach(el => el.remove());
  cells.forEach(c => {
    let el = document.createElement('div');
    el.className = 'cell';
    el.id = `cell-${c.x}-${c.y}`;
    el.style.width = el.style.height = GRID_SIZE-4 + 'px';
    el.style.left = c.x * GRID_SIZE + 2 + 'px';
    el.style.top = c.y * GRID_SIZE + 2 + 'px';
    el.style.background = TIERS[c.tier].color;
    el.innerText = TIERS[c.tier].emoji;
    gameEl.appendChild(el);
  });
  document.getElementById('ui').innerHTML = `Score: ${score}<br>Best: ${highScore}<br>Goal: ${GOAL_SCORE}`;
}

// BUG FIX: Merge stays in destination cell, not average
function checkMerge() {
  let didMerge = false;
  for(let i=0; i<cells.length; i++) {
    for(let j=i+1; j<cells.length; j++) {
      let a = cells[i], b = cells[j];
      if(a.tier === b.tier) {
        let dist = Math.abs(a.x-b.x) + Math.abs(a.y-b.y);
        if(dist === 1) {
          if(a.tier >= TIERS.length - 1) continue;

          // BUG FIX: Occupancy update. Remove both, add 1
          occupancy.delete(key(a.x,a.y));
          occupancy.delete(key(b.x,b.y));

          let oldTier = a.tier;
          a.tier++; // Merge into 'a' position

          // BUG FIX 3: Animation
          let el = document.getElementById(`cell-${a.x}-${a.y}`);
          if(el) el.classList.add('merge');

          combo++;
          let baseScore = TIERS[a.tier].score;
          let comboBonus = combo * 5;
          score += baseScore + comboBonus;
          showScorePopup(a.x,a.y, `+${baseScore + comboBonus}`);

          // BUG FIX: Evolution text identity
          showPopup(`${TIERS[oldTier].emoji} ${TIERS[oldTier].name} → ${TIERS[a.tier].emoji} ${TIERS[a.tier].name}`);
          if(a.tier === TIERS.length-1) showPopup("🐲 LEGENDARY DRAGON EVOLVED!");

          occupancy.add(key(a.x,a.y));
          cells.splice(j,1);
          didMerge = true;

          render();
          setTimeout(checkMerge, 120); // Chain
          return;
        }
      }
    }
  }
  if(!didMerge) combo = 0;
}

function showScorePopup(x,y,text){
  let el = document.createElement('div');
  el.className = 'scorePopup';
  el.style.left = x * GRID_SIZE + 10 + 'px';
  el.style.top = y * GRID_SIZE + 'px';
  el.innerText = text;
  gameEl.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

// BUG FIX 1: Movement only to adjacent empty cells
let dragging = null;
gameEl.addEventListener('touchstart', e => startDrag(e.touches[0]));
gameEl.addEventListener('mousedown', e => startDrag(e));
gameEl.addEventListener('touchend', endDrag);
gameEl.addEventListener('mouseup', endDrag);

function startDrag(e) {
  let rect = gameEl.getBoundingClientRect();
  let x = Math.floor((e.clientX - rect.left) / GRID_SIZE);
  let y = Math.floor((e.clientY - rect.top) / GRID_SIZE);
  dragging = cells.find(c => c.x===x && c.y===y);
  if(dragging) occupancy.delete(key(dragging.x,dragging.y));
}

function endDrag(e) {
  if(!dragging) return;
  let rect = gameEl.getBoundingClientRect();
  let clientX = e.changedTouches? e.changedTouches[0].clientX : e.clientX;
  let clientY = e.changedTouches? e.changedTouches[0].clientY : e.clientY;
  let x = Math.floor((clientX - rect.left) / GRID_SIZE);
  let y = Math.floor((clientY - rect.top) / GRID_SIZE);

  x = Math.max(0, Math.min(COLS - 1, x));
  y = Math.max(0, Math.min(ROWS - 1, y));

  // BUG FIX 1: Only allow move to adjacent empty cell
  let dist = Math.abs(dragging.x - x) + Math.abs(dragging.y - y);
  if(dist === 1 &&!occupancy.has(key(x,y))) {
    dragging.x = x; dragging.y = y;
  }

  occupancy.add(key(dragging.x,dragging.y));
  dragging = null;
  render();
  checkMerge();
}

function updateNextPreview(){
  document.getElementById('nextPreview').innerHTML = `Next:<br>${TIERS[nextTier].emoji} ${TIERS[nextTier].name}`;
}

function showPopup(text) {
  let popup = document.getElementById('evolvePopup');
  popup.innerText = text; popup.style.display='block';
  setTimeout(()=>popup.style.display='none', 1000);
}

// BUG FIX 4: Proper game over - no moves possible
function checkGameOver(){
  // If board full AND no adjacent same-tier pieces
  let boardFull = cells.length >= COLS*ROWS;
  let canMerge = false;
  for(let i=0; i<cells.length; i++){
    for(let j=i+1; j<cells.length; j++){
      let a=cells[i], b=cells[j];
      if(a.tier === b.tier && Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1) canMerge=true;
    }
  }
  if(boardFull &&!canMerge){
    if(score > highScore) { highScore = score; localStorage.setItem('eatEvolveHigh', highScore); }
    showPopup(`GAME OVER\nFinal Score: ${score}`);
  }
}

document.getElementById('spawnBtn').onclick = () => spawnCell();
spawnCell(); spawnCell();
updateNextPreview();
</script>
</body>
</html>
