<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eat to Evolve V1.0</title>
<style>
  body { margin:0; background:#2a5d2a; overflow:hidden; touch-action:none; }
  @media screen and (orientation: portrait) { body::after { content:"ROTATE TO LANDSCAPE"; position:fixed; inset:0; background:#000; color:#fff; font:32px Arial; display:flex; align-items:center; justify-content:center; z-index:9999; } }
  #hud { position:absolute; top:15px; left:20px; color:#fff; font:20px Arial; text-shadow:2px 2px #000; z-index:10; }
  #minimap { position:absolute; top:15px; right:20px; width:150px; height:150px; background:rgba(0,0,0,0.4); border:2px solid #fff; z-index:10; }
  #joystick { position:absolute; bottom:40px; left:40px; width:140px; height:140px; background:rgba(255,255,255,0.1); border:4px solid rgba(255,255,255,0.3); border-radius:50%; z-index:20; }
  #stick { position:absolute; width:60px; height:60px; background:rgba(255,255,255,0.6); border-radius:50%; left:40px; top:40px; }
  .skillWrap { position:absolute; bottom:40px; width:90px; height:90px; z-index:20; }
  #s1Wrap{ right:160px; } #s2Wrap{ right:50px; } #sprintWrap{ right:50px; bottom:150px; width:80px; height:80px; }
  .skillIcon { width:100%; height:100%; border-radius:50%; border:4px solid #fff; background:#333; font-size:40px; display:flex; align-items:center; justify-content:center; }
  .cooldownCanvas { position:absolute; top:0; left:0; width:100%; height:100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="hud">LVL 1 ANT<br>XP: 0/10</div>
  <div id="minimap"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="s1Wrap" class="skillWrap"><div class="skillIcon">🍃</div><canvas id="cd1" class="cooldownCanvas"></canvas></div>
  <div id="s2Wrap" class="skillWrap"><div class="skillIcon">🧪</div><canvas id="cd2" class="cooldownCanvas"></canvas></div>
  <div id="sprintWrap" class="skillWrap"><div class="skillIcon" style="background:rgba(255,0,0,0.6); font-size:14px;">SPRINT</div></div>
<script src="creatures.js"></script>
<script src="effects.js"></script>
<script src="game.js"></script>
</body>
</html>
