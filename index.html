<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eat to Evolve: Merge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');
  body { margin:0; background: linear-gradient(180deg, #4a90e2 0%, #357ABD 100%); display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Fredoka', Arial; overflow:hidden; }
  #game { background: linear-gradient(180deg, #3a7d2a 0%, #2a5d1a 100%); border:8px solid #fff; border-radius:24px; position:relative; touch-action:none; width:320px; height:400px; box-shadow:0 10px 40px rgba(0,0,0,0.4); transition:transform 0.1s; }
  #game.shake { animation: shake 0.2s; }
  @keyframes shake { 0%,100%{transform:translate(0)} 25%{transform:translate(-4px,0)} 75%{transform:translate(4px,0)} }
  #game::before { content:''; position:absolute; width:100%; height:100%; background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 40px 40px; border-radius:16px; }

.cell { position:absolute; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,0.5); transition:left 0.15s cubic-bezier(.17,.89,.32,1.49), top 0.15s cubic-bezier(.17,.89,.32,1.49), transform 0.15s; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.3); border:3px solid rgba(255,255,255,0.2); cursor:pointer; }
.cell.selected { border:3px solid #FFD700; box-shadow:0 0 20px #FFD700; transform:scale(1.1); }
.cell.pop { animation: pop 0.25s; }
  @keyframes pop { 0%{transform:scale(1)} 60%{transform:scale(1.4)} 100%{transform:scale(1)} }
.hint { position:absolute; width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,0.4); border:3px dashed #FFD700; pointer-events:auto; cursor:pointer; animation:pulse 0.8s infinite; z-index:5; }
  @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
  #ui { position:absolute; top:15px; left:15px; color:#fff; font-size:16px; text-shadow:0 2px 4px rgba(0,0,0,0.5); z-index:10; line-height:1.5; }
  #dex { font-size:11px; margin-top:5px; background:rgba(0,0,0,0.4); padding:5px 8px; border-radius:10px; max-width:100px; }
  #spawnChoice { position:absolute; bottom:15px; width:100%; text-align:center; color:#FFD700; font-size:14px; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,0.5); z-index:20; }
  #spawnLanes { display:flex; justify-content:center; gap:15px; margin-top:5px; }
.lane { font-size:28px; padding:4px 12px; background:rgba(0,0,0,0.3); border-radius:12px; cursor:pointer; border:2px solid transparent; }
.lane.safe { border:2px solid #4CAF50; }
.lane.risky { border:2px solid #FF9800; }
.lane.combo { border:2px solid #E91E63; }
.lane:hover { transform:scale(1.1); }
  #evolvePopup { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,0.95); color:#2a5d1a; padding:15px 25px; border-radius:16px; display:none; z-index:50; font-size:22px; text-align:center; border:4px solid #FFD700; font-weight:700; box-shadow:0 5px 20px rgba(0,0,0,0.3); }
.scorePopup { position:absolute; color:#FFD700; font-weight:700; font-size:22px; pointer-events:none; animation:floatUp 0.8s forwards; text-shadow:0 2px 4px rgba(0,0,0,0.5); z-index:30; }
  @keyframes floatUp { from{opacity:1; transform:translateY(0) scale(1)} to{opacity:0; transform:translateY(-50px) scale(1.6)} }
.particle { position:absolute; width:5px; height:5px; background:#FFD700; border-radius:50%; pointer-events:none; animation:particle 0.5s forwards; }
  @keyframes particle { to{opacity:0; transform:translate(var(--x), var(--y)) scale(0)} }
</style>
</head>
<body>
<div id="game">
  <div id="ui">Score: 0<br>Best: 0<br><div id="dex">Evolution Progress</div></div>
  <div id="spawnChoice">NEXT: <span id="nextEmoji">🐜</span><div id="spawnLanes"></div></div>
  <div id="evolvePopup"></div>
</div>

<script>
const GRID_SIZE = 40;
const COLS = 8, ROWS = 10; // FIX 2: SMALLER BOARD
const TIERS = [
  {name:"Ant", emoji:"🐜", color:"#8B4513", score:2},
  {name:"Cockroach", emoji:"🪳", color:"#4a2c17", score:4},
  {name:"Lizard", emoji:"🦎", color:"#228B22", score:8},
  {name:"Bird", emoji:"🐦", color:"#87CEEB", score:16},
  {name:"Crocodile", emoji:"🐊", color:"#006400", score:32},
  {name:"Lion", emoji:"🦁", color:"#DAA520", score:64},
  {name:"Dragon", emoji:"🐲", color:"#FF0000", score:128}
];

let cells = [], occupancy = new Set();
let score = 0, highScore = localStorage.getItem('eatEvolveHigh') || 0;
let unlocked = JSON.parse(localStorage.getItem('eatEvolveDex') || '[1,0,0,0,0,0,0]');
let nextTier = 0, combo = 0, dragonCount = 0;
let gameEl = document.getElementById('game');
let selected = null;
let waitingForSpawn = false;

function key(x,y){ return x+','+y; }

function spawnCell(lane, tier = nextTier) {
  let spawnX = lane;
  let spawnY = 0;
  if(occupancy.has(key(spawnX, spawnY))) { checkGameOver(); return; }
  let newCell = {x:spawnX, y:spawnY, tier:tier, id: Date.now()+Math.random()};
  cells.push(newCell);
  occupancy.add(key(spawnX,spawnY));

  // FIX 4: ESCALATING PRESSURE
  let rand = Math.random();
  if(dragonCount > 0 && rand < 0.3) nextTier = 1; // 30% Cockroach
  else if(dragonCount > 1 && rand < 0.1) nextTier = 2; // 10% Lizard
  else nextTier = Math.random() < 0.8? 0 : 1;

  waitingForSpawn = false;
  render();
  checkMerge();
}

function startGame(){
  // FIX 1: PERFECT TUTORIAL BOARD
  // 🐜 ⬜ 🐜
  // ⬜ 🪳 ⬜
  const layout = [[2,2,0],[4,2,0],[3,3,1]];
  layout.forEach(([x,y,t]) => {
    cells.push({x:x, y:y, tier:t, id: Date.now()+Math.random()});
    occupancy.add(key(x,y));
  });
  render();
  showSpawnChoice();
}

function render() {
  gameEl.querySelectorAll('.hint').forEach(el => el.remove());
  cells.forEach(c => {
    let el = document.getElementById(`cell-${c.id}`);
    if(!el) {
      el = document.createElement('div');
      el.className = 'cell';
      el.id = `cell-${c.id}`;
      el.style.width = el.style.height = (GRID_SIZE-4) + 'px';
      el.onclick = () => handleCreatureTap(c);
      gameEl.appendChild(el);
    }
    if(selected && selected.id===c.id) el.classList.add('selected'); else el.classList.remove('selected');
    el.style.left = (c.x * GRID_SIZE + 2) + 'px';
    el.style.top = (c.y * GRID_SIZE + 2) + 'px';
    el.style.background = TIERS[c.tier].color;
    el.innerText = TIERS[c.tier].emoji;
  });
  document.querySelectorAll('.cell').forEach(el => {
    if(!cells.find(c => `cell-${c.id}` === el.id)) el.remove();
  });
  updateDex();
  document.getElementById('ui').innerHTML = `Score: ${score}<br>Best: ${highScore}<br><div id="dex">${getDexHTML()}</div>`;
  document.getElementById('nextEmoji').innerText = TIERS[nextTier].emoji;
}

function getDexHTML(){
  let html = "<b>Progress</b><br>";
  TIERS.forEach((t,i) => {
    html += `${t.emoji} ${unlocked[i]? '✅' : '🔒'}<br>`;
  });
  return html;
}

function updateDex(){
  TIERS.forEach((t,i) => {
    if(cells.some(c => c.tier >= i)) unlocked[i] = 1;
  });
  localStorage.setItem('eatEvolveDex', JSON.stringify(unlocked));
}

function handleCreatureTap(cell){
  if(waitingForSpawn) return;
  if(selected === cell) { selected = null; }
  else { selected = cell; }
  render();
  if(selected) showHints(selected);
}

function handleHintTap(x,y){
  if(!selected || waitingForSpawn) return;
  let dist = Math.abs(selected.x - x) + Math.abs(selected.y - y);
  if(dist === 1) {
    occupancy.delete(key(selected.x,selected.y));
    selected.x = x;
    selected.y = y;
    occupancy.add(key(x,y));
    selected = null;
    render();
    checkMerge();
    if(!waitingForSpawn) {
      waitingForSpawn = true;
      setTimeout(showSpawnChoice, 250);
    }
  }
}

function showHints(cell){
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  dirs.forEach(([dx,dy]) => {
    let nx = cell.x + dx, ny = cell.y + dy;
    if(nx>=0 && nx<COLS && ny>=0 && ny<ROWS &&!occupancy.has(key(nx,ny))){
      let hint = document.createElement('div');
      hint.className = 'hint';
      hint.style.left = (nx * GRID_SIZE + 2) + 'px';
      hint.style.top = (ny * GRID_SIZE + 2) + 'px';
      hint.onclick = () => handleHintTap(nx,ny);
      gameEl.appendChild(hint);
    }
  });
}

// FIX 3: SMARTER SPAWN LANES
function showSpawnChoice(){
  let emptyLanes = [];
  for(let x=1; x<COLS-1; x+=2) { // Lanes 1, 3, 5, 7
    if(!occupancy.has(key(x,0))) emptyLanes.push(x);
  }
  if(emptyLanes.length === 0) { checkGameOver(); return; }

  const laneDiv = document.getElementById('spawnLanes');
  laneDiv.innerHTML = '';
  emptyLanes.slice(0,3).forEach((lane,i) => {
    let btn = document.createElement('div');
    btn.className = 'lane';
    // Label lanes: safe, risky, combo
    if(i===0) btn.classList.add('safe');
    else if(i===1) btn.classList.add('combo');
    else btn.classList.add('risky');
    btn.innerText = '↓';
    btn.title = i===0? 'Safe' : i===1? 'Combo' : 'Risky';
    btn.onclick = () => spawnCell(lane);
    laneDiv.appendChild(btn);
  });
}

function checkMerge() {
  let didMerge = false;
  for(let i=0; i<cells.length; i++) {
    for(let j=i+1; j<cells.length; j++) {
      let a = cells[i], b = cells[j];
      if(a.tier === b.tier) {
        let dist = Math.abs(a.x-b.x) + Math.abs(a.y-b.y);
        if(dist === 1 && a.tier < TIERS.length - 1) {
          occupancy.delete(key(a.x,a.y));
          occupancy.delete(key(b.x,b.y));

          let oldTier = a.tier;
          a.tier++;
          unlocked[a.tier] = 1;

          if(a.tier === TIERS.length-1) {
            dragonCount++;
            showPopup(`🐲 DRAGON #${dragonCount}! ENDLESS MODE!`);
          }

          gameEl.classList.add('shake');
          setTimeout(()=>gameEl.classList.remove('shake'),200);

          combo++;
          let multiplier = dragonCount > 0? 2 : 1; // FIX 4: Score multiplier
          let baseScore = TIERS[a.tier].score * multiplier;
          let comboBonus = combo * 10 * multiplier;
          score += baseScore + comboBonus;
          showScorePopup(a.x,a.y, `+${baseScore + comboBonus}`);

          showPopup(`${TIERS[oldTier].emoji} → ${TIERS[a.tier].emoji}`);

          let el = document.getElementById(`cell-${a.id}`);
          if(el) el.classList.add('pop');
          setTimeout(()=>el?.classList.remove('pop'),250);

          occupancy.add(key(a.x,a.y));
          cells.splice(j,1);
          didMerge = true;
          render();
          setTimeout(checkMerge, 200); // FIX 3: FASTER CASCADE 200ms
          return;
        }
      }
    }
  }
  if(!didMerge && waitingForSpawn) {
    waitingForSpawn = true;
    setTimeout(showSpawnChoice, 200);
  }
  if(!didMerge) combo = 0;
}

function showScorePopup(x,y,text){
  let el = document.createElement('div');
  el.className = 'scorePopup';
  el.style.left = (x * GRID_SIZE + 8) + 'px';
  el.style.top = (y * GRID_SIZE) + 'px';
  el.innerText = text;
  gameEl.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

function showPopup(text) {
  let popup = document.getElementById('evolvePopup');
  popup.innerText = text; popup.style.display='block';
  setTimeout(()=>popup.style.display='none', 1200);
}
function checkGameOver(){
  let boardFull = cells.length >= COLS*ROWS;
  let canMerge = false;
  for(let i=0; i<cells.length; i++){
    for(let j=i+1; j<cells.length; j++){
      let a=cells[i], b=cells[j];
      if(a.tier === b.tier && Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1) canMerge=true;
    }
  }
  if((boardFull || occupancy.has(key(Math.floor(COLS/2),0))) &&!canMerge){
    if(score > highScore) { highScore = score; localStorage.setItem('eatEvolveHigh', highScore); }
    showPopup(`GAME OVER\nDragons: ${dragonCount}\nScore: ${score}`);
  }
}

startGame();
</script>
</body>
</html>
