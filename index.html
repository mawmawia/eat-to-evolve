<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eat to Evolve: Drop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');
*{ box-sizing:border-box; }
body{ margin:0; background:linear-gradient(180deg,#4a90e2 0%,#357ABD 100%); display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Fredoka',Arial,sans-serif; overflow:hidden; }
#gameContainer{ position:relative; }
#game{ background:linear-gradient(180deg,#3a7d2a 0%,#2a5d1a 100%); border:8px solid #fff; border-radius:24px; position:relative; touch-action:none; width:240px; height:320px; box-shadow:0 10px 40px rgba(0,0,0,.4); overflow:hidden; }
#game::before{ content:''; position:absolute; inset:0; background-image: linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px); background-size:40px 40px; border-radius:16px; pointer-events:none; }
.cell{ position:absolute; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.5); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 4px 8px rgba(0,0,0,.3); border:3px solid rgba(255,255,255,.2); z-index:2; transition: top.25s cubic-bezier(.17,.89,.32,1.49); }
.cell.pop{ animation:pop.25s; z-index:3; }
.cell.spawn{ animation:dropIn.35s cubic-bezier(.17,.89,.32,1.49); }
@keyframes pop{ 0%{transform:scale(1)} 60%{transform:scale(1.4)} 100%{transform:scale(1)} }
@keyframes dropIn{ from{transform:translateY(-40px)} to{transform:translateY(0)} }
#spawnChoice{ position:absolute; top:-50px; width:240px; text-align:center; color:#FFD700; font-size:14px; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,.5); z-index:20; }
#nextEmojiBig{ font-size:40px; display:block; line-height:1; margin-bottom:4px; }
#spawnLanes{ display:flex; justify-content:center; gap:4px; }
.colBtn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:26px; background:rgba(0,0,0,.4); border-radius:10px; cursor:pointer; border:2px solid #666; transition:transform.1s; color:#fff; }
.colBtn:hover:not(.disabled){ transform:scale(1.1); border:2px solid #FFD700; }
.colBtn.disabled{ opacity:.3; cursor:not-allowed; }
#ui{ position:absolute; top:12px; left:12px; color:#fff; font-size:15px; text-shadow:0 2px 4px rgba(0,0,0,.5); z-index:10; line-height:1.4; }
#dex{ font-size:10px; margin-top:4px; background:rgba(0,0,0,.4); padding:4px 6px; border-radius:8px; max-width:90px; }
#evolvePopup{ position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,.95); color:#2a5d1a; padding:12px 20px; border-radius:16px; display:none; z-index:50; font-size:20px; text-align:center; border:4px solid #FFD700; font-weight:700; }
.scorePopup{ position:absolute; color:#FFD700; font-weight:700; font-size:20px; pointer-events:none; animation:floatUp.8s forwards; text-shadow:0 2px 4px rgba(0,0,.5); z-index:30; }
@keyframes floatUp{ from{ opacity:1; transform:translateY(0) scale(1); } to{ opacity:0; transform:translateY(-40px) scale(1.4); } }
#tutorial{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; justify-content:center; align-items:center; z-index:500; padding:20px; }
#tutorialCard{ width:min(330px,90vw); background:#fff; color:#234; border-radius:24px; padding:22px; text-align:center; }
#tutorialCard h2{ margin:0 0 8px; color:#2a5d1a; font-size:27px; }
.tutorialStep{ display:flex; align-items:center; gap:12px; text-align:left; margin:12px 0; font-size:15px; }
.tutorialIcon{ width:42px; height:42px; border-radius:12px; background:#3a7d2a; display:flex; align-items:center; justify-content:center; font-size:25px; }
#tutorialBtn{ margin-top:10px; padding:13px 30px; font-size:19px; font-family:'Fredoka'; background:linear-gradient(#FFD700,#FFA500); color:#5d3a00; border:none; border-radius:18px; box-shadow:0 5px #c67c00; font-weight:700; }
#gameOverScreen{ position:absolute; inset:0; background:rgba(0,0,0,.82); display:none; z-index:100; flex-direction:column; justify-content:center; align-items:center; color:#fff; text-align:center; padding:20px; }
#restartBtn{ padding:16px 36px; font-size:22px; font-family:'Fredoka'; background:linear-gradient(#FFD700,#FFA500); color:#5d3a00; border:none; border-radius:20px; box-shadow:0 6px #c67c00; font-weight:700; cursor:pointer; margin-top:20px; }
.victoryTitle{ font-size:30px; color:#FFD700; margin-bottom:10px; }
</style>
</head>
<body>

<div id="tutorial">
  <div id="tutorialCard">
    <h2>🐜 Eat to Evolve</h2>
    <div class="tutorialStep"><div class="tutorialIcon">⬇️</div><div><b>1. Pick a column</b><br>Tap where you want the creature to fall.</div></div>
    <div class="tutorialStep"><div class="tutorialIcon">🐜</div><div><b>2. Merge!</b><br>Matching creatures merge and evolve.</div></div>
    <div class="tutorialStep"><div class="tutorialIcon">🐲</div><div><b>3. Reach Dragon</b><br>🐜 → 🪳 → 🦎 → 🐦 → 🐊 → 🦁 → 🐲</div></div>
    <button id="tutorialBtn">LET'S PLAY</button>
  </div>
</div>

<div id="gameContainer">
  <div id="spawnChoice"><span id="nextEmojiBig">🐜</span><div id="spawnLanes"></div></div>
  <div id="game">
    <div id="ui">Score: 0<br>Best: 0<br><div id="dex">Progress</div></div>
    <div id="evolvePopup"></div>
    <div id="gameOverScreen"><div id="gameOverText"></div><button id="restartBtn">PLAY AGAIN</button></div>
  </div>
</div>

<script>
const GRID_SIZE = 40;
const COLS = 6;
const ROWS = 8;
const TIERS = [
  {name:"Ant", emoji:"🐜", color:"#8B4513", score:2},
  {name:"Cockroach", emoji:"🪳", color:"#4a2c17", score:4},
  {name:"Lizard", emoji:"🦎", color:"#228B22", score:8},
  {name:"Bird", emoji:"🐦", color:"#87CEEB", score:16},
  {name:"Crocodile", emoji:"🐊", color:"#006400", score:32},
  {name:"Lion", emoji:"🦁", color:"#DAA520", score:64},
  {name:"Dragon", emoji:"🐲", color:"#FF0000", score:128}
];

let board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
let score = 0;
let highScore = Number(localStorage.getItem('eatEvolveHigh') || 0);
let unlocked = JSON.parse(localStorage.getItem('eatEvolveDex') || '[1,0,0,0,0,0,0]');
let nextTier = 0, combo = 0, dragonCount = 0, turns = 0;
let processing = false, pendingVictory = false;
let analytics = loadAnalytics();
const gameEl = document.getElementById('game');

function loadAnalytics(){ try{ return JSON.parse(localStorage.getItem('eatEvolveAnalytics') || '{}'); } catch(e){ return {}; } }
function saveAnalytics(data){ analytics = {...analytics,...data }; localStorage.setItem('eatEvolveAnalytics', JSON.stringify(analytics)); }
function logEvent(name,data={}){ saveAnalytics({ [name]:(analytics[name] || 0) + 1,...data }); }

function updateScore(val){
  score += val;
  if(score > highScore){ highScore = score; localStorage.setItem("eatEvolveHigh", String(highScore)); }
}

/* ===== CORE ===== */
function startGame(){
  board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
  score = 0; combo = 0; dragonCount = 0; turns = 0; processing = false; pendingVictory = false; nextTier = 0;
  document.getElementById('gameOverScreen').style.display = 'none';

  // Starter pieces - now they will fall
  board[5][2] = makeCell(2,5,0);
  board[5][4] = makeCell(4,5,0);
  board[6][3] = makeCell(3,6,1);

  render();
  processing = true;
  processBoard(true); // FIX 1: Settle before giving control
  logEvent("game_start",{ sessionStart:Date.now() });
}

function makeCell(x,y,tier){ return {x,y,tier,id:Date.now()+Math.random()} }

function setupColumns(){
  const laneDiv = document.getElementById('spawnLanes');
  laneDiv.innerHTML='';
  for(let x=0; x<COLS; x++){
    let btn = document.createElement('div');
    btn.className = 'colBtn';
    btn.innerText = '↓';
    if(board[0][x]) btn.classList.add('disabled');
    btn.onclick = () => dropCreature(x);
    laneDiv.appendChild(btn);
  }
  document.getElementById('nextEmojiBig').innerText = TIERS[nextTier].emoji;
}

function dropCreature(col){
  if(processing || board[0][col]) return;
  processing = true;

  let y = ROWS-1;
  while(y >= 0 && board[y][col]) y--;
  if(y < 0) { processing = false; return; }

  let newCell = makeCell(col, y, nextTier);
  board[y][col] = newCell;
  turns++;

  render();
  document.getElementById(`cell-${newCell.id}`)?.classList.add('spawn');

  setTimeout(() => processBoard(false), 300);

  let rand = Math.random();
  if(dragonCount > 0 && rand <.3) nextTier = 1;
  else if(dragonCount > 1 && rand <.1) nextTier = 2;
  else nextTier = Math.random() <.8? 0 : 1;
}

/* ===== PHYSICS ENGINE ===== */
function processBoard(isInitial){
  let changed = false;

  // GRAVITY
  for(let x=0; x<COLS; x++){
    for(let y=ROWS-2; y>=0; y--){
      if(board[y][x]){
        let ny = y;
        while(ny+1 < ROWS &&!board[ny+1][x]) ny++;
        if(ny!== y){
          board[ny][x] = board[y][x];
          board[ny][x].y = ny;
          board[y][x] = null;
          changed = true;
        }
      }
    }
  }

  if(changed) { render(); setTimeout(() => processBoard(isInitial), 250); return; }

  // MERGES
  let merges = findMerges();
  if(merges.length > 0){
    executeMerges(merges);
    setTimeout(() => processBoard(isInitial), 250);
    return;
  }

  // SETTLED - NOW CHECK WIN/LOSE
  processing = false;

  if(pendingVictory){ // FIX 2: Dragon only on settled board
    pendingVictory = false;
    showVictory();
    return;
  }

  if(!isInitial) setupColumns();
  checkGameOver();
}

/* ===== MERGE LOGIC ===== */
function findMerges(){
  let merges = [];
  let used = new Set();
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  for(let y=0; y<ROWS; y++){
    for(let x=0; x<COLS; x++){
      let a = board[y][x];
      if(!a || used.has(a.id) || a.tier >= TIERS.length-1) continue;

      for(let [dx,dy] of dirs){
        let nx = x+dx, ny = y+dy;
        if(nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
        let b = board[ny][nx];
        if(b &&!used.has(b.id) && a.tier === b.tier){
          let survivor = (a.y > b.y || (a.y===b.y && a.x < b.x))? a : b;
          let removed = survivor === a? b : a;
          merges.push({survivor, removed});
          used.add(a.id); used.add(b.id);
          break;
        }
      }
    }
  }
  return merges;
}

function executeMerges(merges){
  merges.forEach(({survivor, removed}) => {
    board[removed.y][removed.x] = null;

    let oldTier = survivor.tier;
    survivor.tier++;
    unlocked[survivor.tier] = 1;

    if(!analytics.first_merge){ logEvent("first_merge",{ time: Date.now() - analytics.sessionStart }); }

    // DRAGON: Set flag, don't exit yet
    if(survivor.tier === TIERS.length-1){
      dragonCount++;
      pendingVictory = true; // FIX 2
      updateScore(TIERS[survivor.tier].score);
    } else {
      combo++;
      let multiplier = dragonCount > 0? 2 : 1;
      let baseScore = TIERS[survivor.tier].score * multiplier;
      let comboBonus = combo * 10 * multiplier;
      updateScore(baseScore + comboBonus);
      showScorePopup(survivor.x, survivor.y, `+${baseScore+comboBonus}`);
      showPopup(`${TIERS[oldTier].emoji} → ${TIERS[survivor.tier].emoji}`);
    }
    document.getElementById(`cell-${survivor.id}`)?.classList.add('pop');
  });
}

/* ===== RENDER + UI ===== */
function render(){
  gameEl.querySelectorAll('.cell').forEach(el=>el.remove());
  for(let y=0; y<ROWS; y++){
    for(let x=0; x<COLS; x++){
      let c = board[y][x];
      if(!c) continue;
      let el = document.createElement('div');
      el.className = 'cell';
      el.id = `cell-${c.id}`;
      el.style.width = el.style.height = (GRID_SIZE-4)+'px';
      el.style.left = (c.x*GRID_SIZE+2)+'px';
      el.style.top = (c.y*GRID_SIZE+2)+'px';
      el.style.background = TIERS[c.tier].color;
      el.innerText = TIERS[c.tier].emoji;
      gameEl.appendChild(el);
    }
  }
  updateDex();
  document.getElementById('ui').innerHTML = `Score: ${score}<br>Best: ${highScore}<br><div id="dex">${getDexHTML()}</div>`;
}

function getDexHTML(){
  let html = "<b>Progress</b><br>";
  TIERS.forEach((t,i)=>{ html += `${t.emoji} ${unlocked[i]?'✅':'🔒'}<br>`; });
  return html;
}
function updateDex(){ TIERS.forEach((t,i)=>{ if(board.flat().some(c=>c && c.tier>=i)) unlocked[i]=1; }); localStorage.setItem('eatEvolveDex', JSON.stringify(unlocked)); }

function showScorePopup(x,y,text){
  let el = document.createElement('div');
  el.className='scorePopup';
  el.style.left = (x*GRID_SIZE+8)+'px';
  el.style.top = (y*GRID_SIZE)+'px';
  el.innerText=text;
  gameEl.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}
function showPopup(text){
  let popup = document.getElementById('evolvePopup');
  popup.innerText=text; popup.style.display='block';
  setTimeout(()=>popup.style.display='none', 1000);
}
function showVictory(){
  let sessionLen = Date.now() - analytics.sessionStart;
  logEvent("dragon_reached",{ sessionLength:sessionLen, turns, finalScore:score });
  document.getElementById('gameOverText').innerHTML =
    `<div class="victoryTitle">🐲 DRAGON!</div>YOU EVOLVED<br>ALL THE WAY TO DRAGON!<br><br>Score: ${score}<br>Turns: ${turns}`;
  document.getElementById('gameOverScreen').style.display='flex';
}
function checkGameOver(){
  if(pendingVictory) return; // Don't check game over if dragon is pending
  let canPlace = board[0].some(cell =>!cell);
  let canMerge = findMerges().length > 0;
  if(!canPlace &&!canMerge){
    let highestTier = board.flat().filter(Boolean).reduce((m,c)=>Math.max(m,c.tier),0);
    let sessionLen = Date.now() - analytics.sessionStart;
    logEvent("game_over",{ sessionLength:sessionLen, turns, highestTier, finalScore:score });
    document.getElementById('gameOverText').innerHTML =
      `GAME OVER<br><br>Highest: ${TIERS[highestTier].emoji} ${TIERS[highestTier].name}<br>Turns: ${turns}<br>Score: ${score}`;
    document.getElementById('gameOverScreen').style.display='flex';
  }
}

/* UI */
document.getElementById('tutorialBtn').onclick=()=>{ document.getElementById('tutorial').style.display='none'; localStorage.setItem('eatEvolveTutorialSeen','1'); };
if(localStorage.getItem('eatEvolveTutorialSeen')){ document.getElementById('tutorial').style.display='none'; }
document.getElementById('restartBtn').onclick=()=>{ logEvent("play_again"); startGame(); };

startGame();
</script>
</body>
</html>
