<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Eat to Evolve: Merge</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
:root{--cell:56px;--board-w:280px;--board-h:392px;--gold:#ffcc00;--green:#45ff72;}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030508}
body{color:white;display:flex;flex-direction:column;align-items:center}
#bootScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030508;z-index:2000;transition:opacity.55s ease;}
.bootDna{font-size:58px;filter:drop-shadow(0 0 18px rgba(255,204,0,.35));animation:dnaPulse 1.1s ease-in-out infinite;}
.bootText{margin-top:12px;font-size:13px;font-weight:900;letter-spacing:3px;color:#aeb8c8;}
.loadTrack{width:210px;height:7px;margin-top:14px;border-radius:99px;background:#111927;border:1px solid #26344b;overflow:hidden;}
.loadFill{height:100%;width:0;background:linear-gradient(90deg,#ffb900,#fff06a,#ffb900);box-shadow:0 0 14px rgba(255,204,0,.45);animation:loadFill 1.5s ease forwards;}
@keyframes dnaPulse{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes loadFill{0%{width:0}55%{width:68%}100%{width:100%}}
#screen{opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity.7s ease,transform.7s ease,visibility 0s linear.7s;background:radial-gradient(circle at 50% 30%,rgba(255,204,0,.11),transparent 45%),linear-gradient(180deg,#080d16,#030508);position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500}
#screen.show{opacity:1;visibility:visible;transform:translateY(0);transition:opacity.7s ease,transform.7s ease;}
.logoCreature{font-size:48px;margin-bottom:4px;animation:creatureFloat 2.4s ease-in-out infinite;}
@keyframes creatureFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.logo{font-size:40px;line-height:1;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,204,0,.3);letter-spacing:-1px;}
.mergeTitle{font-size:17px;font-weight:1000;letter-spacing:6px;color:white;margin-top:6px;}
.tag{color:#8290a6;margin:10px 0 20px;font-size:12px;}
.bestBox{background:linear-gradient(180deg,#151d2a,#0e151f);border:1px solid #2b3a51;border-radius:12px;padding:8px 20px;margin-bottom:20px;font-size:11px;color:#8290a6;box-shadow:0 8px 30px rgba(0,0,0,.2);}
.bestBox strong{color:white;font-size:15px;margin-left:5px;}
#playBtn{width:240px;padding:16px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffd52a,#ffbd00);color:#080808;font-size:18px;font-weight:900;box-shadow:0 8px 25px rgba(255,204,0,.25);}
#playBtn:active{transform:scale(.98);}
#topbar{width:100%;max-width:400px;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#0a0f16;border-bottom:1px solid #1a2433;flex-shrink:0}
.topBtn{background:#151d2a;border:1px solid #29364a;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800;color:#c8d0dc;cursor:pointer}
.title{font-size:10px;font-weight:950;letter-spacing:1px;color:#d7dee9}
#gameWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;width:100%}
#hud{width:var(--board-w);display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.hudCard{flex:1;background:#151d2a;border:1px solid #29364a;border-radius:10px;padding:7px 10px;text-align:center}
.hudLabel{display:block;color:#8290a6;font-size:10px;font-weight:800}
.hudValue{font-size:17px;font-weight:900}
#nextBox{display:flex;align-items:center;gap:10px;background:#151d2a;border:1px solid var(--gold);border-radius:12px;padding:6px 16px;margin-bottom:8px;font-size:13px;font-weight:900}
#game{width:var(--board-w);height:var(--board-h);position:relative;border:2px solid #34445c;border-radius:12px;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(180deg,#101721,#0b1017);background-size:var(--cell) var(--cell);touch-action:none}
#skills{position:fixed;bottom:70px;right:10px;display:flex;gap:8px;z-index:10}
.skillBtn{width:52px;height:52px;border-radius:14px;border:2px solid #29364a;background:linear-gradient(180deg,#151d2a,#0d131d);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8290a6;font-size:22px}
.skillBtn.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 15px rgba(255,204,0,.18)}
.skillBtn.empty{opacity:.6}
.skillCount{font-size:10px;font-weight:900}
#bottombar{width:100%;max-width:400px;height:60px;display:flex;align-items:center;justify-content:space-around;background:#0a0f16;border-top:1px solid #1a2433;flex-shrink:0}
.botBtn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8290a6;font-weight:800;cursor:pointer;min-width:52px}
.botBtn:active{transform:scale(.94)}
.botBtn.soundActive{color:var(--green)}
.cell{position:absolute;width:var(--cell);height:var(--cell);display:grid;place-items:center;font-size:32px;transition:top 100ms ease}
.falling{position:absolute;width:var(--cell);height:var(--cell);display:grid;place-items:center;font-size:32px;z-index:20}
.shake{animation:shake 160ms ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#message{height:20px;text-align:center;color:#aeb8c8;font-size:11px;font-weight:800}
.messageGood{color:var(--green)!important}.messageBad{color:var(--gold)!important}
#gameover{position:absolute;inset:0;background:rgba(2,4,7,.95);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:100;border-radius:12px;text-align:center}
#gameover button{width:220px;padding:14px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffd52a,#ffbd00);color:#080808;font-size:15px;font-weight:900}
#reviveBtn{background:linear-gradient(180deg,#45ff72,#2ecc5d)!important;color:#000!important;}
#newGameBtn{background:linear-gradient(180deg,#ffd52a,#ffbd00)!important;color:#080808!important;}
#shareBtn{background:linear-gradient(180deg,#182333,#101823)!important;color:#ffffff!important;border:1px solid #34445c!important;box-shadow:none!important;}
#modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:900;padding:20px;}
#modalBackdrop.show{display:flex;}
.modal{width:min(340px,92vw);background:linear-gradient(180deg,#151d2a,#0b111a);border:1px solid #33445e;border-radius:18px;padding:24px 20px 20px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.55);animation:modalIn.22s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modalIcon{font-size:42px;margin-bottom:8px;}
.modal h2{margin:0 0 8px;font-size:20px;}
.modal p{margin:0;color:#8290a6;font-size:13px;line-height:1.5;white-space:pre-line;text-align:left;}
.modalBtns{display:flex;gap:10px;margin-top:18px}
.modalBtns button{flex:1;padding:11px;border:1px solid #34445c;border-radius:10px;background:#151d2a;color:white;font-weight:900;}
.modalBtns.primary{background:linear-gradient(180deg,#45ff72,#2ecc5d);color:#000;border:0}
.modal.soon{display:inline-block;margin-top:14px;padding:6px 10px;border-radius:8px;background:#0d151f;border:1px solid #26344b;color:#ffcc00;font-size:10px;font-weight:900;letter-spacing:1px;}
.modalClose{margin-top:18px;width:100%;padding:11px;border:1px solid #34445c;border-radius:10px;background:#151d2a;color:white;font-weight:900;}
</style>
</head>
<body>
<div id="bootScreen"><div class="bootDna">🧬</div><div class="bootText">LOADING...</div><div class="loadTrack"><div class="loadFill"></div></div></div>
<div id="screen"><div class="logoCreature">🐜</div><div class="logo">EAT TO EVOLVE</div><div class="mergeTitle">MERGE</div><div class="tag">Drop • Merge • Evolve • Survive</div><div class="bestBox">BEST: <strong id="titleBest">0</strong></div><button id="playBtn" onclick="startGame(false)">PLAY</button></div>
<div id="topbar" style="display:none"><div class="topBtn" id="profileTop">👤 Guest</div><div class="title">EAT TO EVOLVE: MERGE</div><div class="topBtn" onclick="openPanel('howto')">📝 How</div></div>
<div id="gameWrap" style="display:none"><div id="hud"><div class="hudCard"><span class="hudLabel">Score</span><span class="hudValue" id="score">0</span></div><div class="hudCard"><span class="hudLabel">Best</span><span class="hudValue" id="best">0</span></div></div><div id="nextBox"><span>NEXT</span><span id="nextCreature">🐜</span></div><div id="message">TAP A COLUMN TO DROP</div><div id="game"></div></div>
<div id="skills" style="display:none"><div id="skill1" class="skillBtn locked" onclick="handleSkillClick(1)">⚡<div class="skillCount" id="count1">🔒</div></div><div id="skill2" class="skillBtn locked" onclick="handleSkillClick(2)">✚<div class="skillCount" id="count2">🔒</div></div><div id="skill3" class="skillBtn locked" onclick="handleSkillClick(3)">💣<div class="skillCount" id="count3">🔒</div></div><div id="skill4" class="skillBtn locked" onclick="handleSkillClick(4)">🧬<div class="skillCount" id="count4">🔒</div></div></div>
<div id="bottombar" style="display:none"><div class="botBtn" onclick="openPanel('profile')">👤<span>Profile</span></div><div class="botBtn soundBtn"><span class="soundIcon">🔊</span><span>Sound</span></div><div class="botBtn" onclick="openPanel('leaderboard')">🏆<span>Leaderboard</span></div><div class="botBtn" onclick="openPanel('daily')">📅<span>Daily</span></div><div class="botBtn" onclick="openPanel('shop')">🛍️<span>Shop</span></div></div>
<div id="gameover"><h2>GAME OVER</h2><div>Score: <span id="finalScore">0</span></div><button id="reviveBtn" onclick="attemptRevive()">WATCH AD & CONTINUE</button><button id="newGameBtn" onclick="startGame(true)">NEW GAME</button><button id="shareBtn" onclick="shareScore()">SHARE SCORE</button></div>
<div id="modalBackdrop" onclick="closePanel(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalIcon" id="modalIcon">🧬</div><h2 id="modalTitle">COMING SOON</h2><p id="modalText">Coming soon.</p><div class="modalBtns" id="modalBtns" style="display:none"><button onclick="closePanel()">CANCEL</button><button class="primary" id="modalPrimaryBtn">WATCH AD</button></div><div class="soon" id="modalSoon">COMING SOON</div><button class="modalClose" id="modalCloseBtn" onclick="closePanel()">CLOSE</button></div></div>
<script>
const W=5,H=7;const CREATURES=[{name:"Ant",emoji:"🐜",lvl:1,weight:40},{name:"Cockroach",emoji:"🪳",lvl:2,weight:30},{name:"Bird",emoji:"🐦",lvl:3,weight:20},{name:"Lizard",emoji:"🦎",lvl:4,weight:9},{name:"Crocodile",emoji:"🐊",lvl:5,weight:1}];
let board,score=0,best=0,nextCreature=null,gameOver=false,busy=false,CELL=56;
let highestLvl=1, skillUnlocked=[false,false], skillCharges=[0,0,0,0], adBusy=[false,false], activeSkill=null, soundOn=true, reviveCooldownGames=0;
let sdkReady=false, pendingSkillAd=0; const gameEl=document.getElementById("game");
const panelData={profile:{icon:"👤",title:"Profile",text:"COMING SOON\nConnect to CrazyGames profile 🧬"},leaderboard:{icon:"🏆",title:"Leaderboard",text:"COMING SOON\nGlobal rankings coming 🧬"},daily:{icon:"📅",title:"Daily Rewards",text:"COMING SOON\nDaily rewards coming 🧬"},shop:{icon:"🛍️",title:"Shop",text:"COMING SOON\nSkins & boosters coming 🧬"},
howto:{icon:"📝",title:"HOW TO PLAY",text:"1. TAP A COLUMN TO DROP CREATURE 🐜\n\n2. MERGE 2 IDENTICAL CREATURES\nAnt → Cockroach → Bird → Lizard → Crocodile → DRAGON\n3. UNLOCK DRAGON POWERS\nReach Lv6 ⚡ | Lv7 ✚ | Lv8 💣 | Lv9 🧬\nEach Dragon gives 1 charge\n4. OUT OF CHARGES?\nTap skill to watch ad for +3 uses\n5. GAME OVER?\nWatch Ad to REVIVE: Top 2 rows cleared\n1 Revive per 3 Games\n6. DON'T LET BOARD FILL TO THE TOP!"}};
function openPanel(type){if(gameOver)return;const p=panelData[type];if(!p)return;document.getElementById("modalIcon").textContent=p.icon;document.getElementById("modalTitle").textContent=p.title;document.getElementById("modalText").textContent=p.text;document.getElementById("modalBtns").style.display="none";document.getElementById("modalSoon").style.display="block";document.getElementById("modalCloseBtn").style.display="block";document.getElementById("modalBackdrop").classList.add("show");if(window.CrazyGames?.SDK?.game?.gameplayStop){try{window.CrazyGames.SDK.gameplayStop();}catch(e){}}logEvent("panel_open",{panel:type});}
function closePanel(event){if(event&&event.target!==document.getElementById("modalBackdrop")){return;}document.getElementById("modalBackdrop").classList.remove("show");pendingSkillAd=0;if(!gameOver&&board&&window.CrazyGames?.SDK?.game?.gameplayStart){try{window.CrazyGames.SDK.gameplayStart();}catch(e){}}}
async function initCrazyGames(){const boot=document.getElementById("bootScreen");const sdk=window.CrazyGames?.SDK;try{if(sdk){if(sdk.game?.loadingStart){try{sdk.game.loadingStart();}catch(e){}}await sdk.init();sdkReady=true;const save=await sdk.data.getItem("save");if(save){best=save.best||0;}logEvent("SDK_Ready");if(sdk.game?.loadingStop){try{sdk.game.loadingStop();}catch(e){}}}else{sdkReady=false;}}catch(e){console.warn("CrazyGames SDK unavailable:",e);sdkReady=false;}setTimeout(()=>{boot.style.opacity="0";setTimeout(()=>{boot.style.display="none";document.getElementById("screen").classList.add("show");document.getElementById("titleBest").textContent=best;},550);},1250);}
initCrazyGames();
async function saveGame(){const data={best};try{if(sdkReady&&window.CrazyGames?.SDK?.data){await window.CrazyGames.SDK.data.setItem("save",data);logEvent("save_game");}}catch(e){console.warn("Save failed",e);}}
function addSkillCharge(skillId){skillCharges[skillId-1]++;logEvent("skill_recharged",{skill:skillId,charges:skillCharges[skillId-1]});updateSkillsUI();}
function checkDragonUnlocks(){const unlocks=[{lvl:6,skill:1,icon:"⚡"},{lvl:7,skill:2,icon:"✚"},{lvl:8,skill:3,icon:"💣"},{lvl:9,skill:4,icon:"🧬"}];let changed=false;for(const u of unlocks){const i=u.skill-1;if(highestLvl>=u.lvl&&!skillUnlocked[i]){skillUnlocked[i]=true;skillCharges[i]=1;changed=true;logEvent("dragon_reached",{level:u.skill});logEvent("skill_unlocked",{skill:u.skill});setMessage(`🐲 DRAGON Lv${u.skill} UNLOCKED! ${u.icon}`,"good");}}updateSkillsUI();}
function updateSkillsUI(){for(let i=0;i<4;i++){const btn=document.getElementById("skill"+(i+1)),count=document.getElementById("count"+(i+1));btn.classList.toggle("adbusy",adBusy[i]);if(skillUnlocked[i]){btn.classList.remove("locked");if(skillCharges[i]>0){count.textContent=skillCharges[i];btn.classList.remove("empty");}else{count.textContent="0";btn.classList.add("empty");}}else{btn.classList.add("locked");count.textContent="🔒";}}}
function handleSkillClick(id){const i=id-1;if(!skillUnlocked[i]||adBusy[i]){return;}if(skillCharges[i]===0){openSkillAdModal(id);return;}selectSkill(id);}
function openSkillAdModal(id){pendingSkillAd=id;if(window.CrazyGames?.SDK?.game?.gameplayStop){try{window.CrazyGames.SDK.gameplayStop();}catch(e){}}document.getElementById("modalIcon").textContent=["⚡","✚","💣","🧬"][id-1];document.getElementById("modalTitle").textContent="POWER EMPTY";document.getElementById("modalText").textContent="Watch a short video to receive 3 uses?";document.getElementById("modalBtns").style.display="flex";document.getElementById("modalSoon").style.display="none";document.getElementById("modalCloseBtn").style.display="none";document.getElementById("modalPrimaryBtn").onclick=()=>watchAdForSkill(id);document.getElementById("modalBackdrop").classList.add("show");}
function selectSkill(id){if(activeSkill){return;}activeSkill=id;document.querySelectorAll(".skillBtn").forEach(b=>{b.classList.remove("active");});document.getElementById("skill"+id).classList.add("active");setMessage("ACTIVE - TAP TARGET","good");}
function watchAdForSkill(id){closePanel();const i=id-1;if(adBusy[i])return;if(!window.CrazyGames?.SDK?.ad?.requestAd){setMessage("ADS LOCKED","bad");logEvent("ad_unavailable",{skill:id});return;}adBusy[i]=true;updateSkillsUI();window.CrazyGames.SDK.ad.requestAd("rewarded",{adStarted:()=>{logEvent("ad_started",{skill:id});},adFinished:()=>{skillCharges[i]+=3;adBusy[i]=false;logEvent("skill_ad_watched",{skill:id});updateSkillsUI();setMessage("+3 USES ADDED","good");},adError:(error)=>{adBusy[i]=false;updateSkillsUI();setMessage("AD FAILED","bad");logEvent("ad_error",{skill:id,error});}});}
function attemptRevive(){if(reviveCooldownGames>0){setMessage(`REVIVE IN ${reviveCooldownGames} GAMES`,"bad");return;}watchAdToRevive();}
function watchAdToRevive(){
  if(!window.CrazyGames?.SDK?.ad?.requestAd){setMessage("ADS LOCKED","bad");return;}
  const btn=document.getElementById("reviveBtn");btn.textContent="LOADING AD...";btn.disabled=true;
  window.CrazyGames.SDK.ad.requestAd("rewarded",{
    adStarted:()=>{logEvent("revive_ad_started");},
    adFinished:()=>{
      reviveCooldownGames=3;
      let cleared=0;while(board[0].some(c=>c) && cleared<2){board.shift();board.push(Array(W).fill(null));cleared++;}
      settle();render();
      document.getElementById("gameover").style.display="none";gameOver=false;busy=false;
      setMessage("🐲 REVIVED! BOARD CLEARED!","good");
      if(window.CrazyGames?.SDK?.game?.gameplayStart){try{window.CrazyGames.SDK.gameplayStart();}catch(e){}}
      logEvent("revived");
    },
    adError:(error)=>{
      btn.textContent="WATCH AD & CONTINUE";btn.disabled=false;setMessage("AD FAILED","bad");logEvent("revive_ad_error",{error});
    }
  });
}
function useSkill(x,y){const id=activeSkill;activeSkill=null;document.querySelectorAll(".skillBtn").forEach(b=>{b.classList.remove("active");});if(id===4&&!board[y][x]){setMessage("TAP A CREATURE","bad");return;}skillCharges[id-1]--;logEvent("skill_used",{skill:id});updateSkillsUI();if(id===1){for(let cx=0;cx<W;cx++){board[y][cx]=null;}}if(id===2){for(let cx=0;cx<W;cx++){board[y][cx]=null;}for(let ry=0;ry<H;ry++){board[ry][x]=null;}}if(id===3){for(let ry=y-1;ry<=y+1;ry++){for(let cx=x-1;cx<=x+1;cx++){if(ry>=0&&ry<H&&cx>=0&&cx<W){board[ry][cx]=null;}}}}if(id===4){const targetLvl=board[y][x].lvl;for(let ry=0;ry<H;ry++){for(let cx=0;cx<W;cx++){if(board[ry][cx]?.lvl===targetLvl){board[ry][cx]=null;}}}}settle();const result=resolveMerges();checkDragonUnlocks();render();setMessage("POWER USED!","good");if(result.didMerge){gameEl.classList.add("shake");setTimeout(()=>{gameEl.classList.remove("shake");},160);}saveGame();}
function initBoard(resetSkills=true){
  updateCellSize();
  if(reviveCooldownGames>0){reviveCooldownGames--;}

  if(resetSkills){skillUnlocked=[false,false];skillCharges=[0,0,0,0];}
  adBusy=[false,false,false,false];activeSkill=null; // FIXED 4 SLOTS
  board=Array.from({length:H},()=>Array(W).fill(null));score=0;gameOver=false;busy=false;highestLvl=1;nextCreature=randCreature();
  updateHUD();updateNext();setMessage("TAP A COLUMN TO DROP");render();updateSkillsUI();
  logEvent("Game_Start");
  if(window.CrazyGames?.SDK?.game?.gameplayStart){try{window.CrazyGames.SDK.gameplayStart();}catch(e){}}
}
function updateCellSize(){CELL=gameEl.clientWidth/W;document.documentElement.style.setProperty("--cell",CELL+"px");}
function randCreature(){const total=CREATURES.reduce((a,b)=>a+b.weight,0);let r=Math.random()*total;for(const c of CREATURES){r-=c.weight;if(r<=0){return{...c};}}return{...CREATURES[0]};}
function startGame(fromReplay=false){document.getElementById("screen").style.display="none";document.getElementById("topbar").style.display="flex";document.getElementById("gameWrap").style.display="flex";document.getElementById("skills").style.display="flex";document.getElementById("bottombar").style.display="flex";document.getElementById("gameover").style.display="none";if(fromReplay){logEvent("Play_Again");}initBoard(true);}
function toggleSound(){soundOn=!soundOn;const icon=soundOn?"🔊":"🔇";document.querySelectorAll(".soundBtn").forEach(el=>{const iconEl=el.querySelector(".soundIcon");if(iconEl){iconEl.textContent=icon;}else{el.textContent=icon;}el.classList.toggle("soundActive",soundOn);});}
document.querySelectorAll(".soundBtn").forEach(btn=>{btn.addEventListener("click",toggleSound);});
function updateHUD(){document.getElementById("score").textContent=score;document.getElementById("best").textContent=best;document.getElementById("titleBest").textContent=best;}
function updateNext(){document.getElementById("nextCreature").textContent=getEmojiByLvl(nextCreature.lvl);}
function setMessage(text,type=""){const el=document.getElementById("message");el.textContent=text;el.className=type==="good"?"messageGood":type==="bad"?"messageBad":"";}
function render(){gameEl.querySelectorAll(".cell").forEach(el=>{el.remove();});for(let y=0;y<H;y++){for(let x=0;x<W;x++){const c=board[y][x];if(!c){continue;}const div=document.createElement("div");div.className="cell";div.style.left=x*CELL+"px";div.style.top=y*CELL+"px";div.innerHTML=`<span>${getEmojiByLvl(c.lvl)}</span>`;gameEl.appendChild(div);}}}
async function animateDrop(col,creature,row){const falling=document.createElement("div");falling.className="falling";falling.style.left=col*CELL+"px";falling.style.top="0px";falling.innerHTML=`<span>${getEmojiByLvl(creature.lvl)}</span>`;gameEl.appendChild(falling);const distance=row*CELL;const duration=260+row*55;falling.animate([{transform:`translateY(-${CELL}px)`},{transform:`translateY(${distance}px)`}],{duration});await new Promise(r=>setTimeout(r,duration));falling.remove();}
async function drop(col){if(gameOver||busy||!board||activeSkill){return;}if(col<0||col>=W){return;}busy=true;let row=-1;for(let y=H-1;y>=0;y--){if(board[y][col]===null){row=y;break;}}if(row===-1){setMessage("COLUMN FULL — TRY ANOTHER","bad");busy=false;return;}const creature={...nextCreature};nextCreature=randCreature();updateNext();setMessage("FALLING...");await animateDrop(col,creature,row);board[row][col]=creature;const result=resolveMerges();checkDragonUnlocks();render();if(result.didMerge){gameEl.classList.add("shake");setTimeout(()=>{gameEl.classList.remove("shake");},160);}else{setMessage("NO MERGE — BOARD RISES!","bad");await new Promise(r=>setTimeout(r,220));if(!addPressureRow()){busy=false;gameOverFn();return;}}if(board[0].some(cell=>cell)){busy=false;gameOverFn();return;}updateSkillsUI();busy=false;}
function resolveMerges(){let didMerge=false;while(true){let found=false;outer:for(let y=H-1;y>=0;y--){for(let x=0;x<W;x++){const cur=board[y][x];if(!cur){continue;}if(y+1<H&&board[y+1][x]&&board[y+1][x].lvl===cur.lvl){mergeCells(x,y,x,y+1,cur.lvl+1);found=true;didMerge=true;break outer}if(x+1<W&&board[y][x+1]&&board[y][x+1].lvl===cur.lvl){mergeCells(x,y,x+1,y,cur.lvl+1);found=true;didMerge=true;break outer}}}if(!found){break;}settle()}return{didMerge};}
function mergeCells(x1,y1,x2,y2,newLvl){board[y2][x2].lvl=newLvl;if(newLvl>highestLvl){highestLvl=newLvl;}if(newLvl>=6&&newLvl<=9){addSkillCharge(newLvl-5);}board[y1][x1]=null;score+=10*newLvl;updateHUD();}
function settle(){for(let x=0;x<W;x++){let write=H-1;for(let y=H-1;y>=0;y--){if(board[y][x]){if(write!==y){board[write][x]=board[y][x];board[y][x]=null;}write--;}}}}
function addPressureRow(){if(board[0].some(cell=>cell)){return false;}for(let y=0;y<H-1;y++){board[y]=[...board[y+1]];}const newRow=Array(W).fill(null);for(let x=0;x<W;x++){if(Math.random()<.6){newRow[x]=randCreature();}}board[H-1]=newRow;render();return true;}
function getEmojiByLvl(lvl){if(lvl<=5){return["","🐜","🪳","🐦","🦎","🐊"][lvl];}const d=lvl-5;if(d===1){return"🐲";}if(d===2){return"🐲👑";}if(d===3){return"🐲👑";}return"🐲🔥";}
function gameOverFn(){gameOver=true;logEvent("Game_Over",{score,highestLvl});if(score>best){best=score;saveGame();}updateHUD();document.getElementById("finalScore").textContent=score;document.getElementById("gameover").style.display="flex";
document.getElementById("reviveBtn").style.display = reviveCooldownGames>0? "none" : "block";
document.getElementById("reviveBtn").textContent="WATCH AD & CONTINUE";document.getElementById("reviveBtn").disabled=false;if(window.CrazyGames?.SDK?.game?.gameplayStop){try{window.CrazyGames.SDK.gameplayStop();}catch(e){}}}
gameEl.addEventListener("pointerdown",e=>{if(gameOver||busy||!board){return;}e.preventDefault();const rect=gameEl.getBoundingClientRect();const rawX=e.clientX-rect.left;const rawY=e.clientY-rect.top;const col=Math.max(0,Math.min(W-1,Math.floor(rawX/CELL)));const row=Math.max(0,Math.min(H-1,Math.floor(rawY/CELL)));if(activeSkill){useSkill(col,row);return;}drop(col);});
async function shareScore(){const final = Number(score || 0);const shareText = `🐜 I scored ${final.toLocaleString()} in EAT TO EVOLVE: MERGE! 🧬\n\nCan you beat my score?`;const shareData = {title: "Eat to Evolve: Merge",text: shareText,url: window.location.href};try {if(navigator.share){await navigator.share(shareData);logEvent("score_shared",{score:final,method:"native"});return;}if(navigator.clipboard){await navigator.clipboard.writeText(`${shareText}\n${window.location.href}`);setMessage("SHARE TEXT COPIED!","good");logEvent("score_shared",{score:final,method:"clipboard"});return;}window.prompt("Copy your score:",`${shareText}\n${window.location.href}`);}catch(e){if(e?.name!== "AbortError"){console.warn("Share failed:",e);setMessage("SHARE FAILED - TRY AGAIN","bad");logEvent("share_error",{score:final});}}}
function logEvent(name,data={}){console.log(`[ANALYTICS] ${name}`,data);}
</script>
