<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eat to Evolve: Drop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');
*{ box-sizing:border-box; }
body{ margin:0; background:linear-gradient(180deg,#4a90e2 0%,#357ABD 100%); display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Fredoka',Arial,sans-serif; overflow:hidden; }
#gameContainer{ position:relative; }

/* BOARD: 240 inner + 16 border = 256 */
#game{ background:linear-gradient(180deg,#3a7d2a 0%,#2a5d1a 100%); border:8px solid #fff; border-radius:24px; position:relative; touch-action:none; width:256px; height:336px; box-shadow:0 10px 40px rgba(0,0,0,.4); overflow:hidden; }
#game::before{ content:''; position:absolute; inset:0; background-image: linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px); background-size:40px 40px; border-radius:16px; pointer-events:none; }

/* POSITION WITH LEFT/TOP. ANIMATE WITH TRANSFORM */
.cell{ position:absolute; width:36px; height:36px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.5); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 4px 8px rgba(0,0,0,.3); border:3px solid rgba(255,255,255,.2); z-index:2; transition: left.15s linear, top.15s linear; }
.cell.flash{ animation:flash.3s; z-index:3; }
.cell.merge{ animation:mergePop.3s; z-index:4; }
@keyframes flash{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
@keyframes mergePop{ 0%{transform:scale(1)} 50%{transform:scale(1.5)} 100%{transform:scale(1)} }

/* V0.7.5 FIX: LIFTED TO -95px SO ARROWS ARE VISIBLE */
#spawnChoice{ position:absolute; top:-95px; left:8px; width:240px; text-align:center; color:#FFD700; font-size:14px; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,.5); z-index:20; }
#nextEmojiBig{ font-size:40px; display:block; line-height:1; margin-bottom:4px; }
#spawnLanes{ width:240px; display:grid; grid-template-columns:repeat(6, 40px); gap:0; }
.colBtn{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:26px; background:rgba(0,0,0,.4); border-radius:10px; cursor:pointer; border:2px solid #666; transition:transform.1s; color:#fff; }
.colBtn:hover:not(.disabled){ transform:scale(1.1); border:2px solid #FFD700; }
.colBtn.disabled{ opacity:.3; cursor:not-allowed; }

#ui{ position:absolute; top:12px; left:12px; color:#fff; font-size:15px; text-shadow:0 2px 4px rgba(0,0,0,.5); z-index:10; line-height:1.4; }
#dex{ font-size:10px; margin-top:4px; background:rgba(0,0,0,.4); padding:4px 6px; border-radius:8px; max-width:90px; }
#evolvePopup{ position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,.95); color:#2a5d1a; padding:12px 20px; border-radius:16px; display:none; z-index:50; font-size:20px; text-align:center; border:4px solid #FFD700; font-weight:700; }
.scorePopup{ position:absolute; color:#FFD700; font-weight:700; font-size:20px; pointer-events:none; animation:floatUp.8s forwards; text-shadow:0 2px 4px rgba(0,0,.5); z-index:30; }
@keyframes floatUp{ from{ opacity:1; transform:translateY(0) scale(1); } to{ opacity:0; transform:translateY(-40px) scale(1.4); } }

#tutorial{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; justify-content:center; align-items:center; z-index:500; padding:20px; }
#tutorialCard{ width:min(330px,90vw); background:#fff; color:#234; border-radius:24px; padding:22px; text-align:center; }
#tutorialCard h2{ margin:0 0 8px; color:#2a5d1a; font-size:27px; }
.tutorialStep{ display:flex; align-items:center; gap:12px; text-align:left; margin:12px 0; font-size:15px; }
.tutorialIcon{ width:42px; height:42px; border-radius:12px; background:#3a7d2a; display:flex; align-items:center; justify-content:center; font-size:25px; }
#tutorialBtn{ margin-top:10px; padding:13px 30px; font-size:19px; font-family:'Fredoka'; background:linear-gradient(#FFD700,#FFA500); color:#5d3a00; border:none; border-radius:18px; box-shadow:0 5px #c67c00; font-weight:700; }

#gameOverScreen{ position:absolute; inset:0; background:rgba(0,0,0,.82); display:none; z-index:100; flex-direction:column; justify-content:center; align-items:center; color:#fff; text-align:center; padding:20px; }
#restartBtn{ padding:16px 36px; font-size:22px; font-family:'Fredoka'; background:linear-gradient(#FFD700,#FFA500); color:#5d3a00; border:none; border-radius:20px; box-shadow:0 6px #c67c00; font-weight:700; cursor:pointer; margin-top:20px; }
.victoryTitle{ font-size:30px; color:#FFD700; margin-bottom:10px; }
</style>
</head>
<body>

<div id="tutorial">
  <div id="tutorialCard">
    <h2>🐜 Eat to Evolve</h2>
    <div class="tutorialStep"><div class="tutorialIcon">⬇️</div><div><b>DROP</b><br>Tap a column to drop your creature.</div></div>
    <div class="tutorialStep"><div class="tutorialIcon">✨</div><div><b>MATCH</b><br>Land two matching creatures together.</div></div>
    <div class="tutorialStep"><div class="tutorialIcon">🐲</div><div><b>EVOLVE</b><br>🐜 + 🐜 → 🪳 → 🦎 → 🐦 → 🐊 → 🦁 → 🐲</div></div>
    <div class="tutorialStep"><div class="tutorialIcon">🚫</div><div><b>DON'T FILL THE TOP</b><br>Keep merging before the board reaches the top.</div></div>
    <button id="tutorialBtn">LET'S PLAY</button>
  </div>
</div>

<div id="gameContainer">
  <div id="spawnChoice"><span id="nextEmojiBig">🐜</span><div id="spawnLanes"></div></div>
  <div id="game">
    <div id="ui">Score: 0<br>Best: 0<br><div id="dex">Progress</div></div>
    <div id="evolvePopup"></div>
    <div id="gameOverScreen"><div id="gameOverText"></div><button id="restartBtn">PLAY AGAIN</button></div>
  </div>
</div>

<script>
const GRID_SIZE = 40;
const COLS = 6;
const ROWS = 8;
const TIERS = [
  {name:"Ant", emoji:"🐜", color:"#8B4513", score:2},
  {name:"Cockroach", emoji:"🪳", color:"#4a2c17", score:4},
  {name:"Lizard", emoji:"🦎", color:"#228B22", score:8},
  {name:"Bird", emoji:"🐦", color:"#87CEEB", score:16},
  {name:"Crocodile", emoji:"🐊", color:"#006400", score:32},
  {name:"Lion", emoji:"🦁", color:"#DAA520", score:64},
  {name:"Dragon", emoji:"🐲", color:"#FF0000", score:128}
];

let board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
let score = 0, highScore = Number(localStorage.getItem('eatEvolveHigh') || 0);
let unlocked = JSON.parse(localStorage.getItem('eatEvolveDex') || '[1,0,0,0,0,0,0]');
let nextTier = 0, turnCount = 0, combo = 0, dragonCount = 0, turns = 0;
let processing = false, pendingVictory = false;
let analytics = loadAnalytics();
const gameEl = document.getElementById('game');

function loadAnalytics(){ try{ return JSON.parse(localStorage.getItem('eatEvolveAnalytics') || '{}'); } catch(e){ return {}; } }
function saveAnalytics(data){ analytics = {...analytics,...data }; localStorage.setItem('eatEvolveAnalytics', JSON.stringify(analytics)); }
function logEvent(name,data={}){ saveAnalytics({ [name]:(analytics[name] || 0) + 1,...data }); }
function updateScore(val){ score += val; if(score > highScore){ highScore = score; localStorage.setItem("eatEvolveHigh", String(highScore)); } }

function startGame(){
  board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
  score = 0; combo = 0; dragonCount = 0; turns = 0; turnCount = 0; processing = false; pendingVictory = false; nextTier = 0;
  document.getElementById('gameOverScreen').style.display = 'none';
  render(); setupColumns(false); logEvent("game_start",{ sessionStart:Date.now() });
}

function makeCell(x,y,tier){ return {x,y,tier,id:Date.now()+Math.random()} }

function setupColumns(hideNext){
  const laneDiv = document.getElementById('spawnLanes');
  laneDiv.innerHTML='';
  document.getElementById('spawnChoice').style.visibility = hideNext? 'hidden' : 'visible';
  for(let x=0; x<COLS; x++){
    let btn = document.createElement('div');
    btn.className = 'colBtn';
    btn.innerText = '↓';
    if(board[0][x] || processing) btn.classList.add('disabled');
    btn.onclick = () => dropCreature(x);
    laneDiv.appendChild(btn);
  }
  if(!hideNext) document.getElementById('nextEmojiBig').innerText = TIERS[nextTier].emoji;
}

function pickNextTier(){
  if(turnCount === 0) return 0;
  if(turnCount === 1) return 0;
  let rand = Math.random();
  if(dragonCount > 1 && rand <.1) return 2;
  else if(dragonCount > 0 && rand <.3) return 1;
  else return Math.random() <.8? 0 : 1;
}

function dropCreature(col){
  if(processing || board[0][col]) return;
  processing = true;
  setupColumns(true);

  let targetY = ROWS-1;
  while(targetY >= 0 && board[targetY][col]) targetY--;
  if(targetY < 0) { processing = false; setupColumns(false); return; }

  let newCell = makeCell(col, 0, nextTier);
  board[0][col] = newCell;
  turns++; turnCount++;
  render();
  animateFall(newCell, targetY, () => { processBoard(); });
  nextTier = pickNextTier();
}

function animateFall(cell, targetY, onDone){
  const fallStep = () => {
    let currentY = cell.y;
    if(currentY >= targetY) { onDone(); return; }
    if(board[currentY + 1][cell.x]) { onDone(); return; }

    board[currentY][cell.x] = null;
    cell.y = currentY + 1;
    board[currentY + 1][cell.x] = cell;

    let el = document.getElementById(`cell-${cell.id}`);
    if(el) {
      el.style.left = (cell.x * GRID_SIZE + 2) + 'px';
      el.style.top = (cell.y * GRID_SIZE + 2) + 'px';
    }
    setTimeout(fallStep, 150);
  };
  setTimeout(fallStep, 150);
}

function processBoard(){
  let moved = false;
  for(let x=0; x<COLS; x++){
    for(let y=ROWS-2; y>=0; y--){
      if(board[y][x]){
        let ny = y;
        while(ny+1 < ROWS &&!board[ny+1][x]) ny++;
        if(ny!== y){
          board[ny][x] = board[y][x];
          board[ny][x].y = ny;
          board[y][x] = null;
          moved = true;
        }
      }
    }
  }
  if(moved){ updateDOMPositions(); setTimeout(processBoard, 150); return; }

  let merges = findMerges();
  if(merges.length > 0){ executeMerge(merges[0], () => processBoard()); return; }

  processing = false;
  if(pendingVictory){ pendingVictory = false; showVictory(); return; }
  setupColumns(false);
  checkGameOver();
}

function executeMerge({survivor, removed}, onDone){
  document.getElementById(`cell-${survivor.id}`)?.classList.add('flash');
  document.getElementById(`cell-${removed.id}`)?.classList.add('flash');

  setTimeout(() => {
    board[removed.y][removed.x] = null;
    let oldTier = survivor.tier;
    survivor.tier++;
    unlocked[survivor.tier] = 1;

    if(!analytics.first_merge){ logEvent("first_merge",{ time: Date.now() - analytics.sessionStart }); }

    if(survivor.tier === TIERS.length-1){
      dragonCount++; pendingVictory = true; updateScore(TIERS[survivor.tier].score);
    } else {
      combo++;
      let multiplier = dragonCount > 0? 2 : 1;
      let baseScore = TIERS[survivor.tier].score * multiplier;
      let comboBonus = combo * 10 * multiplier;
      updateScore(baseScore + comboBonus);
      showScorePopup(survivor.x, survivor.y, `+${baseScore+comboBonus}`);
      showPopup(`${TIERS[oldTier].emoji} + ${TIERS[oldTier].emoji} → ${TIERS[survivor.tier].emoji}`);
    }
    document.getElementById(`cell-${survivor.id}`)?.classList.add('merge');

    setTimeout(() => {
      render();
      setTimeout(onDone, 100);
    }, 300);
  }, 300);
}

function findMerges(){
  let merges = []; let used = new Set();
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=0; y<ROWS; y++){
    for(let x=0; x<COLS; x++){
      let a = board[y][x];
      if(!a || used.has(a.id) || a.tier >= TIERS.length-1) continue;
      for(let [dx,dy] of dirs){
        let nx = x+dx, ny = y+dy;
        if(nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
        let b = board[ny][nx];
        if(b &&!used.has(b.id) && a.tier === b.tier){
          let survivor = (a.y > b.y || (a.y===b.y && a.x < b.x))? a : b;
          let removed = survivor === a? b : a;
          return [{survivor, removed}];
        }
      }
    }
  }
  return merges;
}

function render(){
  gameEl.querySelectorAll('.cell').forEach(el=>el.remove());
  for(let y=0; y<ROWS; y++){
    for(let x=0; x<COLS; x++){
      let c = board[y][x];
      if(!c) continue;
      let el = document.createElement('div');
      el.className = 'cell';
      el.id = `cell-${c.id}`;
      el.style.left = (c.x * GRID_SIZE + 2) + 'px';
      el.style.top = (c.y * GRID_SIZE + 2) + 'px';
      el.style.background = TIERS[c.tier].color;
      el.innerText = TIERS[c.tier].emoji;
      gameEl.appendChild(el);
    }
  }
  updateDex();
  document.getElementById('ui').innerHTML = `Score: ${score}<br>Best: ${highScore}<br><div id="dex">${getDexHTML()}</div>`;
}

function updateDOMPositions(){
  for(let y=0; y<ROWS; y++){
    for(let x=0; x<COLS; x++){
      let c = board[y][x];
      if(!c) continue;
      let el = document.getElementById(`cell-${c.id}`);
      if(el){
        el.style.left = (c.x * GRID_SIZE + 2) + 'px';
        el.style.top = (c.y * GRID_SIZE + 2) + 'px';
      }
    }
  }
}

function getDexHTML(){ let html = "<b>Progress</b><br>"; TIERS.forEach((t,i)=>{ html += `${t.emoji} ${unlocked[i]?'✅':'🔒'}<br>`; }); return html; }
function updateDex(){ TIERS.forEach((t,i)=>{ if(board.flat().some(c=>c && c.tier>=i)) unlocked[i]=1; }); localStorage.setItem('eatEvolveDex', JSON.stringify(unlocked)); }
function showScorePopup(x,y,text){ let el = document.createElement('div'); el.className='scorePopup'; el.style.left = (x*GRID_SIZE+10)+'px'; el.style.top = (y*GRID_SIZE)+'px'; el.innerText=text; gameEl.appendChild(el); setTimeout(()=>el.remove(), 800); }
function showPopup(text){ let popup = document.getElementById('evolvePopup'); popup.innerText=text; popup.style.display='block'; setTimeout(()=>popup.style.display='none', 1200); }
function showVictory(){ let sessionLen = Date.now() - analytics.sessionStart; logEvent("dragon_reached",{ sessionLength:sessionLen, turns, finalScore:score }); document.getElementById('gameOverText').innerHTML = `<div class="victoryTitle">🐲 DRAGON!</div>YOU EVOLVED<br>ALL THE WAY TO DRAGON!<br><br>Score: ${score}<br>Turns: ${turns}`; document.getElementById('gameOverScreen').style.display='flex'; }
function checkGameOver(){
  if(pendingVictory) return;
  let boardFull = board[0].every(cell => cell);
  if(boardFull){
    let highestTier = board.flat().filter(Boolean).reduce((m,c)=>Math.max(m,c.tier),0);
    let sessionLen = Date.now() - analytics.sessionStart;
    logEvent("game_over",{ sessionLength:sessionLen, turns, highestTier, finalScore:score });
    document.getElementById('gameOverText').innerHTML = `GAME OVER<br><br>Highest: ${TIERS[highestTier].emoji} ${TIERS[highestTier].name}<br>Turns: ${turns}<br>Score: ${score}`;
    document.getElementById('gameOverScreen').style.display='flex';
  }
}

document.getElementById('tutorialBtn').onclick=()=>{ document.getElementById('tutorial').style.display='none'; localStorage.setItem('eatEvolveTutorialSeen','1'); };
if(localStorage.getItem('eatEvolveTutorialSeen')){ document.getElementById('tutorial').style.display='none'; }
document.getElementById('restartBtn').onclick=()=>{ logEvent("play_again"); startGame(); };

startGame();
</script>
</body>
</html>
