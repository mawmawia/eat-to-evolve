<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eat to Evolve: Merge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');
  body { margin:0; background: linear-gradient(180deg, #4a90e2 0%, #357ABD 100%); display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Fredoka', Arial; overflow:hidden; }
  #gameContainer { position:relative; }
  #game { background: linear-gradient(180deg, #3a7d2a 0%, #2a5d1a 100%); border:8px solid #fff; border-radius:24px; position:relative; touch-action:none; width:320px; height:440px; box-shadow:0 10px 40px rgba(0,0,0,0.4); transition:transform 0.1s; overflow:hidden; }
  #game.shake { animation: shake 0.2s; }
  @keyframes shake { 0%,100%{transform:translate(0)} 25%{transform:translate(-4px,0)} 75%{transform:translate(4px,0)} }
  #game::before { content:''; position:absolute; width:100%; height:100%; background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 40px 40px; border-radius:16px; }

.cell { position:absolute; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,0.5); transition:left 0.15s cubic-bezier(.17,.89,.32,1.49), top 0.15s cubic-bezier(.17,.89,.32,1.49), transform 0.15s; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.3); border:3px solid rgba(255,255,255,0.2); cursor:pointer; }
.cell.selected { border:3px solid #FFD700; box-shadow:0 0 20px #FFD700; transform:scale(1.1); }
.cell.pop { animation: pop 0.25s; } /* FIX 1: 250ms */
.cell.spawn { animation: dropIn 0.3s cubic-bezier(.17,.89,.32,1.49); }
  @keyframes pop { 0%{transform:scale(1)} 60%{transform:scale(1.4)} 100%{transform:scale(1)} }
  @keyframes dropIn { from{transform:translateY(-50px)} to{transform:translateY(0)} }
.hint { position:absolute; width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,0.4); border:3px dashed #FFD700; pointer-events:auto; cursor:pointer; animation:pulse 0.8s infinite; z-index:5; }
  @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
  #ui { position:absolute; top:15px; left:15px; color:#fff; font-size:16px; text-shadow:0 2px 4px rgba(0,0,0,0.5); z-index:10; line-height:1.5; }
  #dex { font-size:11px; margin-top:5px; background:rgba(0,0,0,0.4); padding:5px 8px; border-radius:10px; max-width:100px; }
  #spawnChoice { position:absolute; top:-65px; width:320px; text-align:center; color:#FFD700; font-size:14px; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,0.5); z-index:20; }
  #nextEmojiBig { font-size:40px; display:block; line-height:1; }
  #spawnLanes { display:flex; justify-content:center; gap:15px; margin-top:2px; }
.lane { font-size:28px; padding:4px 12px; background:rgba(0,0,0,0.4); border-radius:12px; cursor:pointer; border:2px solid #666; transition:transform 0.1s; }
.lane:hover { transform:scale(1.1); border:2px solid #FFD700; }
  #evolvePopup { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,0.95); color:#2a5d1a; padding:15px 25px; border-radius:16px; display:none; z-index:50; font-size:22px; text-align:center; border:4px solid #FFD700; font-weight:700; box-shadow:0 5px 20px rgba(0,0,0,0.3); }
  #gameOverScreen { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; z-index:100; flex-direction:column; justify-content:center; align-items:center; color:#fff; }
  #restartBtn { padding:16px 36px; font-size:22px; font-family:'Fredoka'; background:linear-gradient(#FFD700, #FFA500); color:#5d3a00; border:none; border-radius:20px; box-shadow:0 6px #c67c00; font-weight:700; cursor:pointer; margin-top:20px; }
.noMerge { position:absolute; color:#fff; font-weight:700; font-size:16px; pointer-events:none; animation:fadeOut 0.6s forwards; text-shadow:0 2px 4px rgba(0,0,0,0.5); z-index:30; }
  @keyframes fadeOut { from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-20px)} }
.scorePopup { position:absolute; color:#FFD700; font-weight:700; font-size:22px; pointer-events:none; animation:floatUp 0.8s forwards; text-shadow:0 2px 4px rgba(0,0,0,0.5); z-index:30; }
  @keyframes floatUp { from{opacity:1; transform:translateY(0) scale(1)} to{opacity:0; transform:translateY(-50px) scale(1.6)} }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="spawnChoice"><span id="nextEmojiBig">🐜</span><div id="spawnLanes"></div></div>
  <div id="game">
    <div id="ui">Score: 0<br>Best: 0<br><div id="dex">Evolution Progress</div></div>
    <div id="evolvePopup"></div>
    <div id="gameOverScreen">
      <div id="gameOverText"></div>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
const GRID_SIZE = 40;
const COLS = 8, ROWS = 10;
const POP_DURATION = 250; // FIX 1: Match CSS
const TIERS = [
  {name:"Ant", emoji:"🐜", color:"#8B4513", score:2},
  {name:"Cockroach", emoji:"🪳", color:"#4a2c17", score:4},
  {name:"Lizard", emoji:"🦎", color:"#228B22", score:8},
  {name:"Bird", emoji:"🐦", color:"#87CEEB", score:16},
  {name:"Crocodile", emoji:"🐊", color:"#006400", score:32},
  {name:"Lion", emoji:"🦁", color:"#DAA520", score:64},
  {name:"Dragon", emoji:"🐲", color:"#FF0000", score:128}
];

let cells = [], occupancy = new Set();
let score = 0, highScore = localStorage.getItem('eatEvolveHigh') || 0;
let unlocked = JSON.parse(localStorage.getItem('eatEvolveDex') || '[1,0,0,0,0,0,0]');
let nextTier = 0, combo = 0, dragonCount = 0, turns = 0;
let gameEl = document.getElementById('game');
let selected = null, lastMoved = null;
let waitingForSpawn = false;
let lastMoveTime = Date.now();
let analytics = loadAnalytics();

function loadAnalytics(){
  return JSON.parse(localStorage.getItem('eatEvolveAnalytics') || '{}');
}
function saveAnalytics(data){
  analytics = {...analytics,...data};
  localStorage.setItem('eatEvolveAnalytics', JSON.stringify(analytics));
}
function logEvent(name, data={}) {
  saveAnalytics({[name]: (analytics[name]||0)+1,...data});
}

function key(x,y){ return x+','+y; }

function updateScore(val){
  score += val;
  if(score > highScore){
    highScore = score;
    localStorage.setItem("eatEvolveHigh", highScore);
  }
}

function spawnCell(lane, tier = nextTier) {
  let spawnX = lane;
  let spawnY = 0;
  if(occupancy.has(key(spawnX, spawnY))) { showSpawnChoice(); return; }
  let newCell = {x:spawnX, y:spawnY, tier:tier, id: Date.now()+Math.random()};
  cells.push(newCell);
  occupancy.add(key(spawnX,spawnY));

  render();
  const el = document.getElementById(`cell-${newCell.id}`);
  el?.classList.add("spawn");

  let rand = Math.random();
  if(dragonCount > 0 && rand < 0.3) nextTier = 1;
  else if(dragonCount > 1 && rand < 0.1) nextTier = 2;
  else nextTier = Math.random() < 0.8? 0 : 1;

  waitingForSpawn = false;
  turns++;
  processTurn();
}

function startGame(){
  cells = []; occupancy.clear(); score = 0; combo = 0; dragonCount = 0; turns = 0;
  selected = null; lastMoved = null; waitingForSpawn = false;
  document.getElementById('gameOverScreen').style.display = 'none';
  lastMoveTime = Date.now();

  const layout = [[2,2,0],[4,2,0],[3,3,1]];
  layout.forEach(([x,y,t]) => {
    cells.push({x:x, y:y, tier:t, id: Date.now()+Math.random()});
    occupancy.add(key(x,y));
  });
  render();
  showSpawnChoice();
  logEvent("game_start", {sessionStart: Date.now()});
}

function render() {
  gameEl.querySelectorAll('.hint').forEach(el => el.remove());
  cells.forEach(c => {
    let el = document.getElementById(`cell-${c.id}`);
    if(!el) {
      el = document.createElement('div');
      el.className = 'cell';
      el.id = `cell-${c.id}`;
      el.style.width = el.style.height = (GRID_SIZE-4) + 'px';
      el.onclick = () => handleCreatureTap(c);
      gameEl.appendChild(el);
    }
    if(selected && selected.id===c.id) el.classList.add('selected'); else el.classList.remove('selected');
    el.style.left = (c.x * GRID_SIZE + 2) + 'px';
    el.style.top = (c.y * GRID_SIZE + 2) + 'px';
    el.style.background = TIERS[c.tier].color;
    el.innerText = TIERS[c.tier].emoji;
  });
  document.querySelectorAll('.cell').forEach(el => {
    if(!cells.find(c => `cell-${c.id}` === el.id)) el.remove();
  });
  updateDex();
  document.getElementById('ui').innerHTML = `Score: ${score}<br>Best: ${highScore}<br><div id="dex">${getDexHTML()}</div>`;
  document.getElementById('nextEmojiBig').innerText = TIERS[nextTier].emoji;
}

function getDexHTML(){
  let html = "<b>Progress</b><br>";
  TIERS.forEach((t,i) => {
    html += `${t.emoji} ${unlocked[i]? '✅' : '🔒'}<br>`;
  });
  return html;
}

function updateDex(){
  TIERS.forEach((t,i) => {
    if(cells.some(c => c.tier >= i)) unlocked[i] = 1;
  });
  if(unlocked[3] &&!analytics.reachedBird) { analytics.reachedBird = true; logEvent("reached_bird", {time: Date.now()-analytics.sessionStart}); }
  if(unlocked[6] &&!analytics.reachedDragon) { analytics.reachedDragon = true; logEvent("reached_dragon", {time: Date.now()-analytics.sessionStart}); }
  localStorage.setItem('eatEvolveDex', JSON.stringify(unlocked));
}

function handleCreatureTap(cell){
  if(waitingForSpawn) return;
  if(!analytics.firstMove) { analytics.firstMove = Date.now()-analytics.sessionStart; logEvent("first_move", {time: analytics.firstMove}); }
  if(selected === cell) { selected = null; }
  else { selected = cell; }
  render();
  if(selected) showHints(selected);
}

function handleHintTap(x,y){
  if(!selected || waitingForSpawn) return;
  let dist = Math.abs(selected.x - x) + Math.abs(selected.y - y);
  if(dist === 1) {
    const movedCell = selected;
    lastMoved = selected;
    occupancy.delete(key(selected.x,selected.y));
    selected.x = x;
    selected.y = y;
    occupancy.add(key(x,y));
    selected = null;
    let timeSinceLast = Date.now() - lastMoveTime;
    logEvent("move_time", {delta: timeSinceLast});
    lastMoveTime = Date.now();
    render();
    processTurn();
  }
}

function showHints(cell){
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  dirs.forEach(([dx,dy]) => {
    let nx = cell.x + dx, ny = cell.y + dy;
    if(nx>=0 && nx<COLS && ny>=0 && ny<ROWS &&!occupancy.has(key(nx,ny))){
      let hint = document.createElement('div');
      hint.className = 'hint';
      hint.style.left = (nx * GRID_SIZE + 2) + 'px';
      hint.style.top = (ny * GRID_SIZE + 2) + 'px';
      hint.onclick = () => handleHintTap(nx,ny);
      gameEl.appendChild(hint);
    }
  });
}

function showSpawnChoice(){
  let emptyLanes = [];
  for(let x=0; x<COLS; x++) {
    if(!occupancy.has(key(x,0))) emptyLanes.push(x);
  }
  if(emptyLanes.length === 0) { checkGameOver(); return; }

  const laneDiv = document.getElementById('spawnLanes');
  laneDiv.innerHTML = '';
  emptyLanes.forEach((lane) => {
    let btn = document.createElement('div');
    btn.className = 'lane';
    btn.innerText = '↓';
    btn.onclick = () => spawnCell(lane);
    laneDiv.appendChild(btn);
  });
  waitingForSpawn = true;
}

// FIX 2: Each cell only merges once per pass
function processTurn(){
  let merges = findAllMerges();
  if(merges.length > 0){
    merges.sort((a,b) => a.y - b.y || a.x - b.x);
    executeMerge(merges[0]);
    setTimeout(processTurn, POP_DURATION); // FIX 1: Wait for animation
  } else {
    lastMoved = null;
    if(!waitingForSpawn){
      waitingForSpawn = true;
      setTimeout(showSpawnChoice, 200);
    }
  }
}

function findAllMerges(){
  let merges = [];
  let used = new Set(); // FIX 2
  for(let i=0; i<cells.length; i++) {
    for(let j=i+1; j<cells.length; j++) {
      let a = cells[i], b = cells[j];
      if(used.has(a.id) || used.has(b.id)) continue; // FIX 2
      if(a.tier === b.tier && a.tier < TIERS.length - 1) {
        let dist = Math.abs(a.x-b.x) + Math.abs(a.y-b.y);
        if(dist === 1) {
          let survivor = (lastMoved && a.id === lastMoved.id)? a :
                         (lastMoved && b.id === lastMoved.id)? b : a;
          merges.push({...survivor, partnerId: survivor===a? b.id : a.id});
          used.add(a.id); used.add(b.id); // FIX 2
        }
      }
    }
  }
  return merges;
}

function executeMerge(m){
  let survivor = cells.find(c=>c.id===m.id);
  let removed = cells.find(c=>c.id===m.partnerId);
  if(!survivor ||!removed) return;

  occupancy.delete(key(survivor.x,survivor.y));
  occupancy.delete(key(removed.x,removed.y));

  let oldTier = survivor.tier;
  survivor.tier++;
  unlocked[survivor.tier] = 1;

  if(!analytics.firstMerge) { analytics.firstMerge = Date.now()-analytics.sessionStart; logEvent("first_merge", {time: analytics.firstMerge}); }
  if(survivor.tier === TIERS.length-1) {
    dragonCount++;
    showPopup(`🐲 DRAGON #${dragonCount}! ENDLESS MODE!`);
  }

  if(survivor.tier >= 3) {
    gameEl.classList.add('shake');
    setTimeout(()=>gameEl.classList.remove('shake'),200);
  }

  combo++;
  let multiplier = dragonCount > 0? 2 : 1;
  let baseScore = TIERS[survivor.tier].score * multiplier;
  let comboBonus = combo * 10 * multiplier;
  updateScore(baseScore + comboBonus);
  showScorePopup(survivor.x,survivor.y, `+${baseScore + comboBonus}`);
  showPopup(`${TIERS[oldTier].emoji} → ${TIERS[survivor.tier].emoji}`);

  let el = document.getElementById(`cell-${survivor.id}`);
  if(el) el.classList.add('pop');

  occupancy.add(key(survivor.x,survivor.y));
  cells = cells.filter(c => c.id!== removed.id);
  render();
}

function showScorePopup(x,y,text){
  let el = document.createElement('div');
  el.className = 'scorePopup';
  el.style.left = (x * GRID_SIZE + 8) + 'px';
  el.style.top = (y * GRID_SIZE) + 'px';
  el.innerText = text;
  gameEl.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

function showPopup(text) {
  let popup = document.getElementById('evolvePopup');
  popup.innerText = text; popup.style.display='block';
  setTimeout(()=>popup.style.display='none', 1200);
}

// FIX 3: Game over = no lanes + no merges
function checkGameOver(){
  let emptyLanes = [];
  for(let x=0; x<COLS; x++) {
    if(!occupancy.has(key(x,0))) emptyLanes.push(x);
  }
  let canMerge = findAllMerges().length > 0;
  if(emptyLanes.length === 0 &&!canMerge){
    let sessionLen = Date.now() - analytics.sessionStart;
    logEvent("game_over", {sessionLength: sessionLen, turns, highestTier: Math.max(...cells.map(c=>c.tier))});
    document.getElementById('gameOverText').innerHTML = `GAME OVER<br>Turns: ${turns}<br>Dragons: ${dragonCount}<br>Score: ${score}`;
    document.getElementById('gameOverScreen').style.display = 'flex';
  }
}

document.getElementById('restartBtn').onclick = () => {
  logEvent("play_again");
  startGame();
}

startGame();
</script>
</body>
</html>
