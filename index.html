<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eat to Evolve: Merge</title>
<style>
  body { margin:0; background:#1a1a1a; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Arial Black', Arial; overflow:hidden; }
  #game { background:#2a5d2a; border:6px solid #fff; border-radius:12px; position:relative; touch-action:none; box-shadow:0 0 20px rgba(0,0,0,0.5); }
.cell { position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; /* BUG 4: Bigger art */ color:#fff; text-shadow:2px 2px #000; transition:transform 0.12s ease-out; }
.cell.merge { animation: bounce 0.3s; }
  @keyframes bounce { 0%{transform:scale(1)} 50%{transform:scale(1.35)} 100%{transform:scale(1)} }
  #ui { position:absolute; top:10px; left:10px; color:#fff; font-size:16px; text-shadow:2px 2px #000; z-index:10; line-height:1.4; }
  #progression { font-size:14px; margin-top:5px; } /* BUG 5 */
  #nextPreview { position:absolute; bottom:90px; width:100%; text-align:center; color:#FFD700; font-size:14px; font-weight:bold; } /* BUG 2: Bigger */
  #nextPreview.emoji { font-size:56px; display:block; line-height:1; }
  #spawnBtn { position:absolute; bottom:20px; width:100%; text-align:center; }
  #spawnBtn button { padding:18px 40px; font-size:22px; background:linear-gradient(#4CAF50, #2E7D32); color:#fff; border:none; border-radius:15px; box-shadow:0 4px #1B5E20; transition:all 0.1s; } /* BUG 3: Juicy button */
  #spawnBtn button:active { transform:scale(0.95) translateY(2px); box-shadow:0 2px #1B5E20; }
  #evolvePopup { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:#FFD700; padding:15px 25px; border-radius:12px; display:none; z-index:50; font-size:24px; text-align:center; border:2px solid #FFD700; }
.scorePopup { position:absolute; color:#FFD700; font-weight:bold; font-size:22px; pointer-events:none; animation:floatUp 0.8s forwards; text-shadow:2px 2px #000; }
  @keyframes floatUp { from{opacity:1; transform:translateY(0) scale(1)} to{opacity:0; transform:translateY(-50px) scale(1.5)} }
</style>
</head>
<body>
<div id="game" style="width:480px; height:720px;"> <!-- BUG 4: 48px cells -->
  <div id="ui">
    Score: 0<br>
    Best: 0<br>
    <div id="progression">Best: 🐜</div> <!-- BUG 5 -->
  </div>
  <div id="nextPreview">NEXT<div class="emoji">🐜</div>Ant</div>
  <div id="spawnBtn"><button id="spawnButton">SPAWN</button></div>
  <div id="evolvePopup"></div>
</div>

<script>
const GRID_SIZE = 48; // BUG 4
const COLS = 10, ROWS = 15;
const GOAL_SCORE = 1000;
const AUTO_SPAWN_MS = 2500; // BUG: Auto spawn
const TIERS = [
  {name:"Ant", emoji:"🐜", color:"#8B4513", score:2},
  {name:"Beetle", emoji:"🪲", color:"#4B0082", score:4},
  {name:"Lizard", emoji:"🦎", color:"#228B22", score:8},
  {name:"Bird", emoji:"🐦", color:"#87CEEB", score:16},
  {name:"Crocodile", emoji:"🐊", color:"#006400", score:32},
  {name:"Lion", emoji:"🦁", color:"#DAA520", score:64},
  {name:"Dragon", emoji:"🐲", color:"#FF0000", score:128}
];

let cells = [];
let occupancy = new Set();
let score = 0, highScore = localStorage.getItem('eatEvolveHigh') || 0;
let highestTier = parseInt(localStorage.getItem('eatEvolveTier') || 0);
let nextTier = 0;
let combo = 0;
let gameEl = document.getElementById('game');
let spawnTimer = 0;

function key(x,y){ return x+','+y; }

function spawnCell(tier = nextTier) {
  let spawnX = Math.floor(COLS/2);
  let spawnY = 0;
  if(occupancy.has(key(spawnX, spawnY))) { checkGameOver(); return; }

  cells.push({x:spawnX, y:spawnY, tier:tier});
  occupancy.add(key(spawnX,spawnY));

  nextTier = Math.random() < 0.85? 0 : 1; // 85% Ant
  updateNextPreview();
  render();
  checkMerge();
}

function startGame(){
  // BUG 1: Start with 10 random ants
  for(let i=0; i<10; i++){
    let x = Math.floor(Math.random()*COLS);
    let y = Math.floor(Math.random()*4) + 1; // Top 4 rows
    if(!occupancy.has(key(x,y))){
      cells.push({x:x, y:y, tier:0});
      occupancy.add(key(x,y));
    }
  }
  render();
}

function render() {
  gameEl.querySelectorAll('.cell').forEach(el => el.remove());
  cells.forEach(c => {
    let el = document.createElement('div');
    el.className = 'cell';
    el.id = `cell-${c.x}-${c.y}`;
    el.style.width = el.style.height = GRID_SIZE-4 + 'px';
    el.style.left = c.x * GRID_SIZE + 2 + 'px';
    el.style.top = c.y * GRID_SIZE + 2 + 'px';
    el.style.background = TIERS[c.tier].color;
    el.innerText = TIERS[c.tier].emoji;
    gameEl.appendChild(el);
  });
  document.getElementById('ui').innerHTML = `Score: ${score}<br>Best: ${highScore}<br><div id="progression">Best: ${getProgressionString()}</div>`;
}

function getProgressionString(){
  let str = "";
  for(let i=0; i<=highestTier; i++) str += TIERS[i].emoji + " → ";
  return str.slice(0,-3);
}

function checkMerge() {
  let didMerge = false;
  for(let i=0; i<cells.length; i++) {
    for(let j=i+1; j<cells.length; j++) {
      let a = cells[i], b = cells[j];
      if(a.tier === b.tier) {
        let dist = Math.abs(a.x-b.x) + Math.abs(a.y-b.y);
        if(dist === 1) {
          if(a.tier >= TIERS.length - 1) continue;

          occupancy.delete(key(a.x,a.y));
          occupancy.delete(key(b.x,b.y));

          let oldTier = a.tier;
          a.tier++;
          highestTier = Math.max(highestTier, a.tier);
          localStorage.setItem('eatEvolveTier', highestTier);

          let el = document.getElementById(`cell-${a.x}-${a.y}`);
          if(el) el.classList.add('merge');

          combo++;
          let baseScore = TIERS[a.tier].score;
          let comboBonus = combo * 5;
          score += baseScore + comboBonus;
          showScorePopup(a.x,a.y, `+${baseScore + comboBonus}`);

          showPopup(`${TIERS[oldTier].emoji} ${TIERS[oldTier].name} → ${TIERS[a.tier].emoji} ${TIERS[a.tier].name}`);
          if(a.tier === TIERS.length-1) showPopup("🐲 LEGENDARY DRAGON EVOLVED!");

          occupancy.add(key(a.x,a.y));
          cells.splice(j,1);
          didMerge = true;
          render();
          setTimeout(checkMerge, 120);
          return;
        }
      }
    }
  }
  if(!didMerge) combo = 0;
}

function showScorePopup(x,y,text){
  let el = document.createElement('div');
  el.className = 'scorePopup';
  el.style.left = x * GRID_SIZE + 10 + 'px';
  el.style.top = y * GRID_SIZE + 'px';
  el.innerText = text;
  gameEl.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

// Movement + Game Loop
let dragging = null;
gameEl.addEventListener('touchstart', e => startDrag(e.touches[0]));
gameEl.addEventListener('mousedown', e => startDrag(e));
gameEl.addEventListener('touchend', endDrag);
gameEl.addEventListener('mouseup', endDrag);

function startDrag(e) {
  let rect = gameEl.getBoundingClientRect();
  let x = Math.floor((e.clientX - rect.left) / GRID_SIZE);
  let y = Math.floor((e.clientY - rect.top) / GRID_SIZE);
  dragging = cells.find(c => c.x===x && c.y===y);
  if(dragging) occupancy.delete(key(dragging.x,dragging.y));
}
function endDrag(e) {
  if(!dragging) return;
  let rect = gameEl.getBoundingClientRect();
  let clientX = e.changedTouches? e.changedTouches[0].clientX : e.clientX;
  let clientY = e.changedTouches? e.changedTouches[0].clientY : e.clientY;
  let x = Math.floor((clientX - rect.left) / GRID_SIZE);
  let y = Math.floor((clientY - rect.top) / GRID_SIZE);
  x = Math.max(0, Math.min(COLS - 1, x));
  y = Math.max(0, Math.min(ROWS - 1, y));
  let dist = Math.abs(dragging.x - x) + Math.abs(dragging.y - y);
  if(dist === 1 &&!occupancy.has(key(x,y))) { dragging.x = x; dragging.y = y; }
  occupancy.add(key(dragging.x,dragging.y));
  dragging = null;
  render();
  checkMerge();
}

// BUG: Auto spawn loop
setInterval(() => {
  spawnCell();
}, AUTO_SPAWN_MS);

function updateNextPreview(){
  document.getElementById('nextPreview').innerHTML = `NEXT<div class="emoji">${TIERS[nextTier].emoji}</div>${TIERS[nextTier].name}`;
}
function showPopup(text) {
  let popup = document.getElementById('evolvePopup');
  popup.innerText = text; popup.style.display='block';
  setTimeout(()=>popup.style.display='none', 1000);
}
function checkGameOver(){
  let boardFull = cells.length >= COLS*ROWS;
  let canMerge = false;
  for(let i=0; i<cells.length; i++){
    for(let j=i+1; j<cells.length; j++){
      let a=cells[i], b=cells[j];
      if(a.tier === b.tier && Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1) canMerge=true;
    }
  }
  if((boardFull || occupancy.has(key(Math.floor(COLS/2),0))) &&!canMerge){
    if(score > highScore) { highScore = score; localStorage.setItem('eatEvolveHigh', highScore); }
    showPopup(`GAME OVER\nFinal Score: ${score}`);
    clearInterval();
  }
}

// BUG 3: Button juice
document.getElementById('spawnButton').onclick = () => {
  spawnCell();
  document.getElementById('spawnButton').style.transform = 'scale(0.95)';
  setTimeout(()=>document.getElementById('spawnButton').style.transform = 'scale(1)', 100);
};

startGame(); // Start full
updateNextPreview();
</script>
</body>
</html>
